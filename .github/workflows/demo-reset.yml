name: Demo reset

# D39 (DP3): the published demo rebuilds its data every night, so each day starts clean and its times stay
# "today" (they are relative to when the build runs). It also keeps the free Supabase project awake.
# Only the demo's own database: `demoDatabaseRefusal` (apps/api/src/dev-demo/demo-target.ts) refuses anything
# else, production's project above all. Run it by hand after the first setup or to clean up mid-day.
# DP5: the demo is built on this runner's own Postgres and copied in one transaction. Seeding straight into
# Supabase (Oregon) took 2 h 45 min; visitors saw it half built. Now the old demo stays until the copy commits.

on:
  schedule:
    # 09:15 UTC = 5:15 AM Eastern (4:15 AM in winter): before the shop's day in the data starts.
    - cron: '15 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-reset
  cancel-in-progress: false

jobs:
  rebuild:
    name: Rebuild the demo data
    runs-on: ubuntu-latest
    environment: demo
    services:
      # Same major version as the demo's Supabase (17), so its pg_dump and psql fit both ends.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # Session pooler URL of the demo Supabase project (port 5432; the direct host is IPv6 only).
      DEMO_DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
      DEMO_SUPABASE_REF: ${{ vars.DEMO_SUPABASE_REF }}
    steps:
      - name: Refuse missing settings
        run: |
          if [ -z "$DEMO_DATABASE_URL" ] || [ -z "$DEMO_SUPABASE_REF" ]; then
            echo "DEMO_DATABASE_URL (secret) and DEMO_SUPABASE_REF (variable) must be set on the demo GitHub Environment. Values are not printed."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build --workspace=@ltl-shop/shared
      - run: npm run prisma:generate --workspace=@ltl-shop/api
      - name: Build the demo on the runner's Postgres
        env:
          DEMO_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ltl_shop_demo
        run: npm run prisma:demo-local --workspace=@ltl-shop/api
      - name: Copy it to the demo's Supabase in one transaction
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          umask 077
          docker exec "$PG_CONTAINER" pg_dump -U postgres -d ltl_shop_demo --schema=public --no-owner --no-privileges --no-comments > "$RUNNER_TEMP/demo.sql"
          # Refuses unless DEMO_DATABASE_URL is the demo's own project (never production).
          npm run --silent prisma:demo-publish-sql --workspace=@ltl-shop/api < "$RUNNER_TEMP/demo.sql" > "$RUNNER_TEMP/publish.sql"
          # The URL travels as an environment variable, never on a command line or in the log.
          docker exec -i -e DEMO_DATABASE_URL "$PG_CONTAINER" sh -c 'psql "$DEMO_DATABASE_URL" -X -q -v ON_ERROR_STOP=1 --single-transaction' < "$RUNNER_TEMP/publish.sql"
          rm -f "$RUNNER_TEMP/demo.sql" "$RUNNER_TEMP/publish.sql"
          echo "Demo copied."
