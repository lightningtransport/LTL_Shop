name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ltl_shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ltl_shop
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ltl_shop
      AUTH_DEV_BYPASS: 'true'
      DATA_SOURCE: supabase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate --workspace=@ltl-shop/api
      - run: npm exec --workspace=@ltl-shop/api -- prisma migrate deploy
      - run: npm run db:seed
      - run: npm run verify
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
