const PERIODS = { month: ['This month', '2026-10-01'], '3m': ['Last 3 months', '2026-08-01'], year: ['This year', '2026-01-01'], all: ['All time', '0000'] };

const hoursIn = (n, k) => Object.entries(HOURS[n] ?? {}).filter(([m]) => `${m}-31` >= PERIODS[k][1]).reduce((a, [, h]) => a + h, 0);
function yearTotals(n) { const e = ledger(n).filter((x) => inPeriod(x.date, 'year')); return { parts: e.filter((x) => x.kind === 'parts').reduce((a, x) => a + x.amt, 0), outside: e.filter((x) => x.kind === 'outside').reduce((a, x) => a + x.amt, 0) }; }

/* ───────── Render ───────── */
const ROUTES = {
  purchases: ['Purchases', 'receipt'], repairs: ['Outside repairs', 'wrench'], parts: ['Parts', 'package'], vendors: ['Vendors', 'store'], trucks: ['Trucks', 'truck'],
};
function render() {
  document.querySelectorAll('.dev').forEach((b) => b.className = `dev h-8 px-3 ${b.dataset.device === 'desktop' ? 'border-l' : ''} ${UI.device === b.dataset.device ? 'bg-primary text-primary-foreground' : ''}`);
  const phone = UI.device === 'phone';
  document.getElementById('stage').innerHTML = `<div class="${phone ? 'w-[390px] h-[800px] rounded-[2rem] border-4' : 'w-full max-w-[1280px] h-[820px] rounded-xl border'} relative flex overflow-hidden bg-background shadow-xl">${app(phone)}</div>`;
  document.getElementById('presets').innerHTML = Object.entries(PRESETS).map(([k, [l]]) => `<button data-preset="${k}" class="h-8 rounded-md border px-2 hover:bg-accent">${l}</button>`).join('');
  lucide.createIcons();
  if (UI.focus) { const el = document.getElementById(UI.focus); if (el) { el.focus(); const v = el.value ?? ''; try { el.setSelectionRange(v.length, v.length); } catch (e) { /* select */ } } UI.focus = null; }
}

function navItem(key, label, icon, phone, live = true) {
  const on = UI.route === key || (key === 'trucks' && UI.route === 'truck');
  return `<button data-nav="${live ? key : ''}" data-soon="${live ? '' : label}" class="flex ${phone ? 'h-11' : 'h-9'} w-full items-center gap-2.5 rounded-md px-2 text-left ${on ? 'bg-accent font-medium text-foreground' : 'text-muted-foreground hover:bg-accent hover:text-foreground'}">${ic(icon)}${label}</button>`;
}
function nav(phone) {
  const grp = (t, items, extra = '') => `<div class="space-y-0.5"><p class="flex items-center gap-2 px-2 pb-1 text-xs text-muted-foreground">${t}${extra}</p>${items.join('')}</div>`;
  return `<nav class="flex-1 space-y-5 overflow-y-auto p-3" aria-label="Admin">
    ${grp('Operations', [navItem('', 'Dashboard', 'gauge', phone, false), navItem('', 'Yard Operations', 'warehouse', phone, false), navItem('', 'Work Orders', 'clipboard-list', phone, false), navItem('trucks', 'Trucks', 'truck', phone)])}
    ${grp('Parts &amp; costs', [navItem('purchases', 'Purchases', 'receipt', phone), navItem('repairs', 'Outside repairs', 'wrench', phone), navItem('parts', 'Parts', 'package', phone), navItem('vendors', 'Vendors', 'store', phone)], `<span class="rounded bg-primary/15 px-1.5 text-[10px] font-semibold uppercase text-primary">New</span>`)}
    ${grp('Setup', [navItem('', 'Mechanics', 'users', phone, false), navItem('', 'Job Catalog', 'library', phone, false), navItem('', 'Shop workflow', 'workflow', phone, false)])}
    ${grp('Audit', [navItem('', 'History', 'history', phone, false)])}
  </nav>`;
}

function app(phone) {
  const brand = `<div class="flex h-14 shrink-0 items-center gap-2 border-b px-4"><div class="grid size-7 place-items-center rounded-md bg-success/20 text-success">${ic('zap', 's14')}</div><span class="font-semibold">LTL Shop</span><span class="text-xs text-muted-foreground">Admin</span></div>`;
  const side = phone ? '' : `<aside class="flex w-56 shrink-0 flex-col border-r bg-background">${brand}${nav(false)}<div class="border-t p-3"><p class="font-medium">Cristian</p><p class="text-xs text-muted-foreground">Shop Manager</p></div></aside>`;
  const crumbs = UI.route === 'truck'
    ? `<button data-nav="trucks" class="hover:text-foreground">Trucks</button>${ic('chevron-right', 's14')}<span class="font-medium text-foreground">${UI.truck}</span>`
    : `${UI.route === 'trucks' ? '' : `<span>Parts &amp; costs</span>${ic('chevron-right', 's14')}`}<span class="font-medium text-foreground">${ROUTES[UI.route][0]}</span>`;
  const header = `<header class="flex h-14 shrink-0 items-center justify-between gap-3 border-b bg-background px-4">
      <div class="flex min-w-0 items-center gap-1">${phone ? `<button data-act="drawer" class="-ml-2 grid size-10 place-items-center rounded-md text-muted-foreground hover:bg-accent" aria-label="Menu">${ic('menu')}</button>` : ''}
      <nav class="flex min-w-0 items-center gap-1.5 whitespace-nowrap text-muted-foreground" aria-label="Breadcrumb">${crumbs}</nav></div>
      <div class="grid size-8 shrink-0 place-items-center rounded-full bg-primary/15 text-xs font-semibold text-primary">CR</div></header>`;
  let body;
  if (UI.state === 'loading') body = skeleton(phone);
  else if (UI.state === 'error') body = `<div class="m-4 flex flex-col items-center gap-2 rounded-xl border border-destructive/40 bg-destructive/10 px-4 py-8 text-center"><span class="text-destructive-text">${ic('circle-alert', 's20')}</span><p class="font-medium">${ROUTES[UI.route]?.[0] ?? 'This page'} did not load.</p><p class="text-muted-foreground">Check the connection and try again. Nothing you saved is lost.</p><button data-act="retry" class="${BTN.outline} mt-2 ${phone ? 'h-11' : 'h-9'}">${ic('rotate-cw')}Retry</button></div>`;
  else body = { purchases: purchasesView, repairs: repairsView, parts: partsView, vendors: vendorsView, trucks: trucksView, truck: truckView }[UI.route](phone);
  return `${side}
    <div class="relative flex min-w-0 flex-1 flex-col">
      ${header}
      <main class="min-h-0 flex-1 overflow-y-auto"><div class="${phone ? 'px-4' : 'px-6'} pb-16 pt-5">${body}</div></main>
      ${UI.panel ? panel(phone) : ''}
      ${UI.dialog ? dialog(phone) : ''}
      ${UI.toast ? `<div class="toast-in absolute bottom-4 left-1/2 z-[60] flex w-[min(92%,400px)] -translate-x-1/2 items-center gap-2 rounded-lg border bg-card px-3 py-2.5 shadow-xl" role="status">${ic(UI.toast[0] === 'ok' ? 'circle-check' : UI.toast[0] === 'info' ? 'info' : 'circle-alert', UI.toast[0] === 'ok' ? 'text-success' : UI.toast[0] === 'info' ? 'text-primary' : 'text-destructive-text')}<span class="flex-1">${UI.toast[1]}</span></div>` : ''}
    </div>
    ${phone && UI.drawer ? `<div data-act="drawer" class="absolute inset-0 z-40 bg-black/50"></div><aside class="side-in absolute inset-y-0 left-0 z-50 flex w-72 flex-col border-r bg-background">${brand}${nav(true)}</aside>` : ''}`;
}

const pageHead = (title, desc, action, phone) => `<div class="mb-4 flex ${phone ? 'flex-col gap-3' : 'items-start justify-between gap-4'}"><div class="min-w-0"><h1 class="text-2xl font-semibold tracking-tight">${title}</h1><p class="text-muted-foreground">${desc}</p></div>${action ? `<div class="flex shrink-0 gap-2">${action}</div>` : ''}</div>`;
const empty = (icon, title, text, action = '') => `<div class="flex flex-col items-center gap-1.5 rounded-xl border border-dashed px-4 py-12 text-center text-muted-foreground"><span class="mb-1 grid size-10 place-items-center rounded-full bg-muted">${ic(icon, 's20')}</span><p class="font-medium text-foreground">${title}</p><p class="max-w-sm">${text}</p>${action ? `<div class="mt-2">${action}</div>` : ''}</div>`;
const sel = (id, opts, val, phone, extra = '') => `<select id="${id}" ${extra} class="field ${phone ? 'h-11 text-base' : 'h-9'}">${opts.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(val) ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
const searchBox = (id, val, ph, phone) => `<div class="relative min-w-0 flex-1"><span class="pointer-events-none absolute left-2.5 top-1/2 -translate-y-1/2 text-muted-foreground">${ic('search', 's14')}</span><input id="${id}" data-filter="${id}" value="${esc(val)}" placeholder="${ph}" class="field ${phone ? 'h-11 text-base' : 'h-9'} pl-8" /></div>`;
const truckOpts = (first) => [['', first], ...TRUCKS.map((t) => [t.n, `Truck ${t.n} · ${t.veh}`])];

/* ── Purchases ── */
function purchasesView(phone) {
  const h = phone ? 'h-11' : 'h-9';
  const head = pageHead('Purchases', 'Parts bought from vendors, with the invoice. Assign them to a truck to count them in its costs.', `<button data-act="new-purchase" class="${BTN.primary} ${h} ${phone ? 'w-full' : ''}">${ic('plus')}New purchase</button>`, phone);
  if (!S.purchases.length) return head + empty('receipt', 'No purchases yet', 'Save a vendor invoice with its parts. It can go to one truck, several, or stay as shop stock.', `<button data-act="new-purchase" class="${BTN.primary} h-9">${ic('plus')}New purchase</button>`);
  const q = UI.q.trim().toLowerCase();
  const list = S.purchases.filter((p) => (!UI.fVendor || p.vendor === UI.fVendor) && (!UI.fTruck || (UI.fTruck === 'none' ? pAlloc(p)[''] : pTrucks(p).includes(UI.fTruck))) && inPeriod(p.date, UI.fPeriod)
    && (!q || [vn(p.vendor), p.inv, ...p.lines.map(lineText)].join(' ').toLowerCase().includes(q))).sort((a, b) => b.date.localeCompare(a.date));
  const live = list.filter((p) => !p.voided);
  const total = live.reduce((a, p) => a + pTotal(p), 0);
  const noTruck = live.reduce((a, p) => a + (pAlloc(p)[''] ?? 0), 0);
  const filters = `<div class="mb-3 flex ${phone ? 'flex-col' : 'flex-wrap'} gap-2">${searchBox('q', UI.q, 'Invoice #, vendor or part', phone)}
    <div class="${phone ? 'grid grid-cols-3' : 'flex'} gap-2">${sel('fVendor', [['', 'All vendors'], ...S.vendors.filter((v) => v.parts).map((v) => [v.id, v.name])], UI.fVendor, phone, 'data-filter="fVendor"')}
    ${sel('fTruck', [['', 'All trucks'], ['none', 'No truck'], ...TRUCKS.map((t) => [t.n, `Truck ${t.n}`])], UI.fTruck, phone, 'data-filter="fTruck"')}
    ${sel('fPeriod', Object.entries(PERIODS).map(([k, [l]]) => [k, l]), UI.fPeriod, phone, 'data-filter="fPeriod"')}</div></div>`;
  const sum = `<p class="mb-2 text-xs text-muted-foreground"><span class="tnum">${live.length} purchase${live.length === 1 ? '' : 's'} · <b class="text-foreground">${money(total)}</b>${noTruck ? ` · No truck: ${money(noTruck)}` : ''}</span></p>`;
  if (!list.length) return head + filters + empty('search-x', 'No purchases match', 'Try another vendor, truck or period.', `<button data-act="clear-filters" class="${BTN.outline} h-9">Clear filters</button>`);
  const truckCell = (p) => { const t = pTrucks(p); const none = pAlloc(p)['']; return t.length ? `${t.map((n) => `Truck ${n}`).join(', ')}${none ? ' <span class="text-muted-foreground">+ no truck</span>' : ''}` : '<span class="text-muted-foreground">No truck · shop stock</span>'; };
  const fileCell = (p) => (p.file ? `<span class="text-muted-foreground" title="${esc(p.file)}">${ic('paperclip', 's14')}</span>` : chip('warn', 'No invoice file'));
  if (phone) return head + filters + sum + `<ul class="space-y-2">${list.map((p) => `<li><button data-open="purchase:${p.id}" class="${UI.flash === p.id ? 'flash' : ''} block w-full space-y-1 rounded-xl border bg-card p-3 text-left hover:bg-accent/40 ${p.voided ? 'opacity-60' : ''}">
      <div class="flex items-center gap-2"><span class="font-semibold">${vn(p.vendor)}</span><span class="font-mono text-xs text-muted-foreground">${esc(p.inv)}</span><span class="tnum ml-auto font-semibold ${p.voided ? 'line-through' : ''}">${money(pTotal(p))}</span></div>
      <p class="text-xs text-muted-foreground">${fd(p.date)} · ${p.lines.length} line${p.lines.length === 1 ? '' : 's'} · ${truckCell(p)}</p>
      <div class="flex flex-wrap gap-1.5">${p.voided ? chip('bad', 'Voided') : ''}${p.file ? '' : chip('warn', 'No invoice file')}</div></button></li>`).join('')}</ul>`;
  return head + filters + sum + `<div class="overflow-hidden rounded-xl border bg-card"><table class="w-full text-left"><thead class="border-b text-xs text-muted-foreground"><tr><th class="px-4 py-2.5 font-medium">Date</th><th class="px-3 font-medium">Vendor</th><th class="px-3 font-medium">Invoice #</th><th class="px-3 font-medium">Lines</th><th class="px-3 font-medium">Truck</th><th class="px-3 font-medium">File</th><th class="px-4 text-right font-medium">Total</th></tr></thead>
    <tbody class="divide-y">${list.map((p) => `<tr data-open="purchase:${p.id}" class="${UI.flash === p.id ? 'flash' : ''} cursor-pointer hover:bg-accent/40 ${p.voided ? 'text-muted-foreground' : ''}"><td class="tnum whitespace-nowrap px-4 py-3">${fd(p.date)}</td><td class="px-3 font-medium">${vn(p.vendor)}</td><td class="px-3 font-mono text-[13px]">${esc(p.inv)}</td><td class="tnum px-3">${p.lines.length}</td><td class="px-3">${truckCell(p)}</td><td class="px-3">${fileCell(p)}</td><td class="tnum whitespace-nowrap px-4 text-right font-semibold">${p.voided ? `${chip('bad', 'Voided')} <span class="line-through">${money(pTotal(p))}</span>` : money(pTotal(p))}</td></tr>`).join('')}</tbody></table></div>`;
}

/* ── Outside repairs ── */
function repairsView(phone) {
  const h = phone ? 'h-11' : 'h-9';
  const head = pageHead('Outside repairs', 'Work done by another shop, with its invoice. Always on a truck; link it to the Job you sent out.', `<button data-act="new-repair" class="${BTN.primary} ${h} ${phone ? 'w-full' : ''}">${ic('plus')}New outside repair</button>`, phone);
  if (!S.repairs.length) return head + empty('wrench', 'No outside repairs yet', 'When a part or a truck comes back from another shop, save its invoice here.', `<button data-act="new-repair" class="${BTN.primary} h-9">${ic('plus')}New outside repair</button>`);
  const q = UI.rq.trim().toLowerCase();
  const list = S.repairs.filter((r) => !q || [vn(r.vendor), r.inv, r.desc, r.truck].join(' ').toLowerCase().includes(q)).sort((a, b) => b.date.localeCompare(a.date));
  const jobOf = (r) => (r.job ? (EXT_JOBS[r.truck] ?? []).find((j) => j.id === r.job) : null);
  const jobCell = (r) => { const j = jobOf(r); return j ? `<span class="inline-flex items-center gap-1.5">${ic('building-2', 's14 text-primary')}${j.name} · <span class="font-mono text-xs">${j.wo}</span> · ${j.kind}</span>` : '<span class="text-muted-foreground">Not linked</span>'; };
  const live = list.filter((r) => !r.voided);
  const top = `<div class="mb-3">${searchBox('rq', UI.rq, 'Truck, vendor, invoice # or description', phone)}</div><p class="mb-2 text-xs text-muted-foreground tnum">${live.length} repair${live.length === 1 ? '' : 's'} · <b class="text-foreground">${money(live.reduce((a, r) => a + r.amount, 0))}</b></p>`;
  if (!list.length) return head + top + empty('search-x', 'No outside repairs match', 'Try another truck or vendor.');
  if (phone) return head + top + `<ul class="space-y-2">${list.map((r) => `<li><button data-open="repair:${r.id}" class="${UI.flash === r.id ? 'flash' : ''} block w-full space-y-1 rounded-xl border bg-card p-3 text-left hover:bg-accent/40 ${r.voided ? 'opacity-60' : ''}">
      <div class="flex items-center gap-2"><span class="font-semibold">Truck ${r.truck}</span><span class="text-muted-foreground">${vn(r.vendor)}</span><span class="tnum ml-auto font-semibold ${r.voided ? 'line-through' : ''}">${money(r.amount)}</span></div>
      <p>${esc(r.desc)}</p><p class="text-xs text-muted-foreground">${fd(r.date)} · <span class="font-mono">${esc(r.inv)}</span></p><p class="text-xs">${jobCell(r)}</p>${r.voided ? chip('bad', 'Voided') : ''}</button></li>`).join('')}</ul>`;
  return head + top + `<div class="overflow-hidden rounded-xl border bg-card"><table class="w-full text-left"><thead class="border-b text-xs text-muted-foreground"><tr><th class="px-4 py-2.5 font-medium">Date</th><th class="px-3 font-medium">Truck</th><th class="px-3 font-medium">Vendor</th><th class="px-3 font-medium">What was done</th><th class="px-3 font-medium">Job</th><th class="px-3 font-medium">Invoice #</th><th class="px-4 text-right font-medium">Amount</th></tr></thead>
    <tbody class="divide-y">${list.map((r) => `<tr data-open="repair:${r.id}" class="${UI.flash === r.id ? 'flash' : ''} cursor-pointer hover:bg-accent/40 ${r.voided ? 'text-muted-foreground' : ''}"><td class="tnum whitespace-nowrap px-4 py-3">${fd(r.date)}</td><td class="px-3 font-medium">${r.truck}</td><td class="px-3">${vn(r.vendor)}</td><td class="px-3">${esc(r.desc)}</td><td class="px-3 text-[13px]">${jobCell(r)}</td><td class="px-3 font-mono text-[13px]">${esc(r.inv)} ${r.file ? '' : chip('warn', 'No file')}</td><td class="tnum whitespace-nowrap px-4 text-right font-semibold">${r.voided ? `${chip('bad', 'Voided')} <span class="line-through">${money(r.amount)}</span>` : money(r.amount)}</td></tr>`).join('')}</tbody></table></div>`;
}

/* ── Parts (the PM catalog) ── */
function partsView(phone) {
  const h = phone ? 'h-11' : 'h-9';
  const head = pageHead('Parts', 'The same catalog the PM mechanic picks from. Costs never show to mechanics.', `<button data-act="new-part" class="${BTN.outline} ${h} ${phone ? 'w-full' : ''}">${ic('plus')}Add part</button>`, phone);
  const firstUse = S.parts.every((p) => p.cost == null);
  const banner = firstUse ? `<div class="mb-4 flex gap-3 rounded-xl border border-primary/30 bg-primary/5 p-4">${ic('info', 's20 text-primary')}<div><p class="font-medium">These are the PM parts from the base list.</p><p class="text-muted-foreground">Add a unit cost or a vendor to start tracking costs. The PM mechanic keeps seeing the same parts.</p></div></div>` : '';
  const q = UI.pq.trim().toLowerCase();
  const list = S.parts.filter((p) => (UI.pInactive || p.active) && (!UI.pMake || !p.fits.length || p.fits.some((f) => f.startsWith(UI.pMake))) && (!q || `${p.pn} ${p.name}`.toLowerCase().includes(q)));
  const filters = `<div class="mb-4 flex ${phone ? 'flex-col' : 'flex-wrap items-center'} gap-2">${searchBox('pq', UI.pq, 'Part number or name', phone)}
    <div class="flex gap-2">${sel('pMake', [['', 'Fits any truck'], ...MAKES.map((m) => [m, `Fits ${m}`])], UI.pMake, phone, 'data-filter="pMake"')}
    <label class="flex shrink-0 items-center gap-2 rounded-md border px-3 ${h}"><input type="checkbox" data-filter="pInactive" ${UI.pInactive ? 'checked' : ''} class="size-4" />Show inactive</label></div></div>`;
  if (!list.length) return head + banner + filters + empty('search-x', 'No parts match', 'Try another number or make.');
  const costCell = (p) => (p.cost == null ? chip('warn', 'No cost yet') : `<span class="tnum font-medium">${money(p.cost)}</span>`);
  const lpCell = (p) => { const lp = lastPaid(p.id); return lp ? `<span class="tnum">${money(lp.cost)}</span> <span class="text-xs text-muted-foreground">· ${fd(lp.date)} · ${vn(lp.vendor)}</span>` : '<span class="text-xs text-muted-foreground">Not bought yet</span>'; };
  const groups = CATS.map(([k, name]) => [name, list.filter((p) => p.cat === k)]).filter(([, l]) => l.length);
  const body = groups.map(([name, l]) => phone
    ? `<section class="mb-4"><h2 class="mb-1.5 flex items-center gap-2 font-semibold">${name}<span class="tnum rounded-md bg-muted px-1.5 text-xs font-normal text-muted-foreground">${l.length}</span></h2><ul class="divide-y rounded-xl border bg-card">${l.map((p) => `<li><button data-open="part:${p.id}" class="${UI.flash === p.id ? 'flash' : ''} block w-full space-y-1 px-3 py-3 text-left hover:bg-accent/40 ${p.active ? '' : 'opacity-60'}"><div class="flex items-center gap-2"><span class="font-mono text-[13px]">${esc(p.pn)}</span><span class="ml-auto">${costCell(p)}</span></div><p class="font-medium">${esc(p.name)}</p><p class="text-xs text-muted-foreground">${fitsText(p)}${p.vendor ? ` · ${vn(p.vendor)}` : ''}${p.active ? '' : ' · Inactive'}</p></button></li>`).join('')}</ul></section>`
    : `<section class="mb-5"><h2 class="mb-2 flex items-center gap-2 text-base font-semibold">${name}<span class="tnum rounded-md bg-muted px-1.5 text-xs font-normal text-muted-foreground ring-1 ring-border">${l.length}</span></h2><div class="overflow-hidden rounded-xl border bg-card"><table class="w-full table-fixed text-left"><thead class="border-b text-xs text-muted-foreground"><tr><th class="w-36 px-4 py-2 font-medium">Part #</th><th class="px-3 font-medium">Name</th><th class="w-44 px-3 font-medium">Fits</th><th class="w-28 px-3 font-medium">Unit cost</th><th class="w-64 px-3 font-medium">Last paid</th><th class="w-24 px-3 font-medium">Status</th><th class="w-12"></th></tr></thead>
      <tbody class="divide-y">${l.map((p) => `<tr class="${UI.flash === p.id ? 'flash' : ''} ${p.active ? '' : 'text-muted-foreground'}"><td class="truncate px-4 py-2.5 font-mono text-[13px]">${esc(p.pn)}</td><td class="truncate px-3 font-medium">${esc(p.name)}${p.openPm ? ` <span title="In the PM in progress on ${p.openPm}" class="ml-1 inline-flex align-middle text-primary">${ic('wrench', 's14')}</span>` : ''}</td><td class="truncate px-3">${fitsText(p)}</td><td class="px-3">${costCell(p)}</td><td class="truncate px-3">${lpCell(p)}</td><td class="px-3">${p.active ? chip('ok', 'Active') : chip('mute', 'Inactive')}</td><td class="pr-2"><button data-open="part:${p.id}" class="grid size-9 place-items-center rounded-md text-muted-foreground hover:bg-accent" aria-label="Edit ${esc(p.pn)}">${ic('pencil')}</button></td></tr>`).join('')}</tbody></table></div></section>`).join('');
  return head + banner + filters + body + `<p class="text-xs text-muted-foreground">The mockup shows 22 of the 91 parts in <span class="font-mono">pm-parts.csv</span>. Unit costs are made up.</p>`;
}

/* ── Vendors ── */
function vendorsView(phone) {

function draftLines(d) { return d.lines.map((l) => ({ qty: parseQty(l.qty), cost: parseMoney(l.cost), truck: d.split ? l.truck : d.truck })); }
function calcDraft(d) {
  const ls = draftLines(d);
  const ok = ls.map((l) => (Number.isFinite(l.qty) && Number.isFinite(l.cost) && l.qty != null && l.cost != null ? Math.round(l.qty * l.cost) : null));
  const sub = ok.reduce((a, c) => a + (c ?? 0), 0);
  const tax = parseMoney(d.tax) || 0, fr = parseMoney(d.freight) || 0;
  const usable = ls.map((l, i) => ({ qty: 1, cost: ok[i] ?? 0, truck: l.truck })).filter((l) => l.cost > 0);
  const alloc = usable.length ? allocate(usable, (Number.isFinite(tax) ? tax : 0) + (Number.isFinite(fr) ? fr : 0)) : {};
  return { line: ok, sub, total: sub + (Number.isFinite(tax) ? tax : 0) + (Number.isFinite(fr) ? fr : 0), alloc };
}

    ${p?.openPm ? `<div class="flex gap-2 rounded-lg border border-primary/40 bg-primary/5 p-3">${ic('wrench', 'mt-0.5 text-primary')}<p>In the <b>PM in progress on ${p.openPm}</b>. Its make and Active can change after that PM is finished.</p></div>` : ''}
    <div>${label('cat', 'PM category')}<select id="cat" data-f="cat" class="field ${h}">${CATS.map(([k, n]) => `<option value="${k}" ${k === d.cat ? 'selected' : ''}>${n}</option>`).join('')}</select><p class="mt-1 text-xs text-muted-foreground">The PM shows it under this switch.</p></div>
    <div class="grid ${phone ? '' : 'grid-cols-[12rem_1fr]'} gap-3"><div>${label('pn', 'Part number')}${inp('pn', d.pn, phone, 'autocomplete="off"', d.errors.pn)}${err(d.errors.pn)}</div><div>${label('pname', 'Name')}<input id="pname" data-f="name" value="${esc(d.name)}" class="field ${h} ${d.errors.name ? 'bad' : ''}" />${err(d.errors.name)}</div></div>
    <fieldset><legend class="mb-1.5 font-medium">Fits</legend>
      <div class="space-y-2"><label class="flex items-center gap-2"><input type="radio" name="fits" data-f="allFits" value="1" ${d.allFits ? 'checked' : ''} class="size-4" />All trucks</label><label class="flex items-center gap-2"><input type="radio" name="fits" data-f="allFits" value="0" ${!d.allFits ? 'checked' : ''} class="size-4" />Only these makes</label></div>
      ${!d.allFits ? `<div class="mt-2 flex flex-wrap gap-1.5">${MAKES.map((m) => `<button data-make="${m}" aria-pressed="${d.makes.includes(m)}" class="inline-flex min-h-9 items-center gap-1.5 rounded-full border px-3 ${d.makes.includes(m) ? 'border-primary bg-primary/15 text-primary' : 'hover:bg-accent'}">${d.makes.includes(m) ? ic('check', 's14') : ''}${m}</button>`).join('')}</div><div class="mt-2">${label('model', 'Model', true)}${inp('model', d.model, phone, 'placeholder="E.g. Cascadia"')}</div>` : ''}
      ${err(d.errors.fits)}${d.block?.fits ? err(d.block.fits) : ''}</fieldset>
    <div class="grid grid-cols-2 gap-3"><div>${label('cost', 'Unit cost (USD)', true)}${moneyInp('cost', d.cost, phone, 'data-f="cost" placeholder="No cost yet"', d.errors.cost)}${err(d.errors.cost)}</div><div>${label('pvendor', 'Usual vendor', true)}<select id="pvendor" data-f="vendor" class="field ${h}"><option value="">None</option>${S.vendors.filter((v) => v.parts && (v.active || v.id === d.vendor)).map((v) => `<option value="${v.id}" ${v.id === d.vendor ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}</select></div></div>
    <p class="text-xs text-muted-foreground">New purchases fill in the last price paid to that vendor; this cost is the reference when there is none. Mechanics never see it.</p>
    <label class="flex items-start justify-between gap-3 rounded-lg border p-3"><span><span class="block font-medium">Active</span><span class="text-xs text-muted-foreground">Inactive parts leave the PM picker. Past PMs keep showing them.</span></span><input type="checkbox" data-f="active" ${d.active ? 'checked' : ''} class="mt-1 size-5" /></label>
    ${d.block?.active ? `<div class="flex gap-2 rounded-lg border border-destructive/40 bg-destructive/10 p-3 text-destructive-text" role="alert">${ic('circle-alert', 'mt-0.5')}<span>${d.block.active}</span></div>` : ''}`;
  return panelShell(phone, p ? `Edit ${p.pn}` : 'Add part', p ? catName(p.cat) : 'PM catalog', body, footSave(phone, d, p ? 'Save part' : 'Add part'));
}
function savePart(d) {
  const e = {};
  if (!d.name.trim()) e.name = 'Enter the name the mechanic will see.';
  if (d.pn.trim() && S.parts.some((p) => p.id !== d.editId && p.cat === d.cat && p.pn.toLowerCase() === d.pn.trim().toLowerCase())) e.pn = 'This part number is already in this category.';
  if (!d.allFits && !d.makes.length) e.fits = 'Choose at least one make, or “All trucks”.';
  const c = parseMoney(d.cost); if (Number.isNaN(c)) e.cost = 'Use a number like 24.10.';
  d.errors = e;
  return !Object.keys(e).length;
}
function commitPart(d) {
  const fits = d.allFits ? [] : d.makes.map((m) => (d.model.trim() && d.makes.length === 1 ? `${m} ${d.model.trim()}` : m));
  const base = d.editId ? part(d.editId) : { id: 'p' + Date.now(), used: 0 };
  const rec = { ...base, cat: d.cat, pn: d.pn.trim(), name: d.name.trim(), fits, cost: parseMoney(d.cost), vendor: d.vendor || null, active: d.active };
  if (d.editId) S.parts = S.parts.map((p) => (p.id === d.editId ? rec : p)); else S.parts.push(rec);
  return [rec, d.editId ? `${rec.pn || rec.name} saved. The PM picker uses it from now on.` : `${rec.name} added to ${catName(rec.cat)}.`];
}

/* Vendor add / edit */
function vendorDraft(v) { return v ? { type: 'vendorForm', editId: v.id, ...v, errors: {}, saving: false, dirty: false } : { type: 'vendorForm', editId: null, name: '', parts: true, repairs: false, phone: '', email: '', acct: '', notes: '', active: true, errors: {}, saving: false, dirty: false }; }
function vendorForm(phone, d) {
  const h = phone ? 'h-11 text-base' : 'h-9';
  const toggle = (k, l) => `<button data-vk="${k}" aria-pressed="${d[k]}" class="inline-flex min-h-9 items-center gap-1.5 rounded-full border px-3 ${d[k] ? 'border-primary bg-primary/15 text-primary' : 'hover:bg-accent'}">${d[k] ? ic('check', 's14') : ''}${l}</button>`;
  const body = `${saveErr(d)}
    <div>${label('vname', 'Name')}<input id="vname" data-f="name" value="${esc(d.name)}" autocomplete="off" class="field ${h} ${d.errors.name ? 'bad' : ''}" />${err(d.errors.name)}</div>
    <div><p class="mb-1.5 font-medium">Does</p><div class="flex flex-wrap gap-1.5">${toggle('parts', 'Parts')}${toggle('repairs', 'Outside repairs')}</div>${err(d.errors.does)}</div>
    <div class="grid ${phone ? '' : 'grid-cols-2'} gap-3"><div>${label('vphone', 'Phone', true)}<input id="vphone" data-f="phone" type="tel" value="${esc(d.phone)}" class="field ${h}" /></div><div>${label('vemail', 'Email', true)}<input id="vemail" data-f="email" type="email" value="${esc(d.email)}" class="field ${h}" /></div></div>
    <div>${label('vacct', 'Our account number', true)}<input id="vacct" data-f="acct" value="${esc(d.acct)}" class="field font-mono ${h}" /></div>
    <div>${label('vnotes', 'Notes', true)}<textarea id="vnotes" data-f="notes" rows="2" class="field py-2">${esc(d.notes)}</textarea></div>
    <label class="flex items-start justify-between gap-3 rounded-lg border p-3"><span><span class="block font-medium">Active</span><span class="text-xs text-muted-foreground">Inactive vendors keep their history but leave the suggestions.</span></span><input type="checkbox" data-f="active" ${d.active ? 'checked' : ''} class="mt-1 size-5" /></label>`;
  return panelShell(phone, d.editId ? `Edit ${d.name || 'vendor'}` : 'Add vendor', 'Shared by Purchases and Outside repairs', body, footSave(phone, d, d.editId ? 'Save vendor' : 'Add vendor'));
}
function saveVendor(d) {
  const e = {};
  if (!d.name.trim()) e.name = 'Enter the vendor name.';
  const same = S.vendors.find((v) => v.id !== d.editId && v.name.toLowerCase() === d.name.trim().toLowerCase());
  if (same) e.name = `“${same.name}” already exists. Open it instead of adding it twice.`;
  if (!d.parts && !d.repairs) e.does = 'Choose Parts, Outside repairs or both.';
  d.errors = e;
  return !Object.keys(e).length;
}
function commitVendor(d) {
  const rec = { id: d.editId ?? 'v' + Date.now(), name: d.name.trim(), parts: d.parts, repairs: d.repairs, phone: d.phone, email: d.email, acct: d.acct, notes: d.notes, active: d.active };
  if (d.editId) S.vendors = S.vendors.map((v) => (v.id === d.editId ? rec : v)); else S.vendors.push(rec);
  return [rec, `${rec.name} saved.`];
}

/* Dialogs */
function dialog(phone) {
  const shell = (title, desc, body, actions) => `<div class="absolute inset-0 z-40 bg-black/50"></div>
    <div role="dialog" aria-modal="true" class="${phone ? 'sheet-in absolute inset-x-0 bottom-0 rounded-t-2xl' : 'absolute left-1/2 top-1/2 w-[460px] -translate-x-1/2 -translate-y-1/2 rounded-xl'} z-50 border bg-card p-5 shadow-2xl">
      ${phone ? '<div class="mx-auto -mt-2 mb-3 h-1 w-10 rounded-full bg-muted-foreground/40"></div>' : ''}
      <h2 class="text-base font-semibold">${title}</h2><p class="mt-1 text-muted-foreground">${desc}</p>${body}
      <div class="mt-4 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">${actions}</div></div>`;
  const h = phone ? 'h-11' : 'h-9';
  if (UI.dialog.kind === 'discard') return shell('Discard this form?', 'What you typed is not saved.', '', `<button data-act="keep" class="${BTN.outline} ${h}">Keep editing</button><button data-act="discard" class="${BTN.danger} ${h}">Discard</button>`);
  const rec = UI.dialog.rec;
  return shell(`Void ${vn(rec.vendor)} ${rec.inv}?`, `Nothing is deleted. It stays crossed out, its ${money(rec.amount ?? pTotal(rec))} comes off the truck costs, and the invoice number can be saved again.`,
    `<label for="void-reason" class="mt-4 block font-medium">Why?</label><input id="void-reason" value="${esc(UI.dialog.reason ?? '')}" placeholder="E.g. entered twice, wrong vendor" class="field mt-1.5 ${phone ? 'h-11 text-base' : 'h-9'} ${UI.dialog.err ? 'bad' : ''}" />${UI.dialog.err ? err('Say why it is voided.') : ''}`,
    `<button data-act="keep" class="${BTN.outline} ${h}">Back</button><button data-act="void" class="${BTN.primary} ${h}">${ic('ban')}Void</button>`);
}

/* ───────── Actions ───────── */
function toast(kind, text) { UI.toast = [kind, text]; render(); clearTimeout(window.__t); window.__t = setTimeout(() => { UI.toast = null; UI.flash = null; render(); }, 3200); }
function openPanel(type, id) {
  UI.menu = false;
  if (type === 'purchase') UI.panel = { type: 'purchaseView', id };
  else if (type === 'repair') UI.panel = { type: 'repairView', id };
  else if (type === 'part') UI.panel = partDraft(part(id));
  else if (type === 'vendor') UI.panel = vendorDraft(vendor(id));
}
function closePanel() { if (UI.panel?.dirty) { UI.dialog = { kind: 'discard' }; return render(); } UI.panel = null; UI.menu = false; render(); }
function editFromView() {
  const P = UI.panel; UI.menu = false;
  if (P.type === 'purchaseView') {
    const p = S.purchases.find((x) => x.id === P.id); const trucks = pTrucks(p); const split = trucks.length > 1 || (trucks.length === 1 && pAlloc(p)['']);
    UI.panel = { ...newPurchaseDraft(), editId: p.id, vendorText: vn(p.vendor), date: p.date, inv: p.inv, truck: split ? '' : (trucks[0] ?? ''), split: !!split, tax: centsToInput(p.tax || null), freight: centsToInput(p.freight || null), notes: p.notes,
      file: p.file ? { name: p.file, size: '312 KB', progress: 100 } : null, lines: p.lines.map((l) => ({ part: l.part ?? '', other: !l.part, desc: l.desc, qty: String(l.qty), cost: centsToInput(l.cost), truck: l.truck })) };
  } else {
    const r = S.repairs.find((x) => x.id === P.id);
    UI.panel = { ...newRepairDraft(r.truck, r.job ?? ''), editId: r.id, vendorText: vn(r.vendor), date: r.date, inv: r.inv, desc: r.desc, amount: centsToInput(r.amount), file: r.file ? { name: r.file, size: '1.2 MB', progress: 100 } : null };
  }
}
function prefillCost(d, i) {
  const l = d.lines[i]; if (!l.part) return;
  const v = S.vendors.find((x) => x.name.toLowerCase() === d.vendorText.trim().toLowerCase());
  const fromVendor = v && S.purchases.filter((p) => p.vendor === v.id && !p.voided).sort((a, b) => b.date.localeCompare(a.date)).flatMap((p) => p.lines).find((x) => x.part === l.part);
  const c = fromVendor?.cost ?? part(l.part).cost;
  if (c != null) l.cost = centsToInput(c);
}
function doSave() {
  const d = UI.panel;
  const ok = { purchaseForm: savePurchase, repairForm: saveRepair, partForm: savePart, vendorForm: saveVendor }[d.type](d);
  d.saveError = null;
  if (!ok) return render();
  if (d.file && d.file.progress < 100) { d.saveError = 'Wait for the invoice file to finish uploading.'; return render(); }
  d.saving = true; render();
  setTimeout(() => {
    d.saving = false;
    const fail = document.getElementById('failnext');
    if (fail.checked) { fail.checked = false; d.saveError = 'Could not save. Nothing was saved. Check the connection and try again — what you typed is still here.'; return render(); }
    const [rec, msg] = { purchaseForm: commitPurchase, repairForm: commitRepair, partForm: commitPart, vendorForm: commitVendor }[d.type](d);
    UI.panel = null; UI.flash = rec.id;
    toast('ok', msg);
  }, 700);
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('button, tr[data-open], div[data-act]'); if (!el) return;
  if (el.dataset.device) { UI.device = el.dataset.device; return render(); }
  if (el.id === 'theme') { document.documentElement.classList.toggle('dark'); el.textContent = document.documentElement.classList.contains('dark') ? 'Light' : 'Dark'; return render(); }
  if (el.id === 'reset') { S = seed(); UI = fresh(); return render(); }
  if (el.dataset.preset) { S = seed(); UI = fresh(); PRESETS[el.dataset.preset][1](); return render(); }
  if (el.dataset.soon) { UI.drawer = false; return toast('info', `${el.dataset.soon} does not change in this proposal.`); }
  if (el.dataset.nav) { UI.route = el.dataset.nav; UI.panel = null; UI.drawer = false; UI.state = 'ok'; return render(); }
  if (el.dataset.truck) { UI.route = 'truck'; UI.truck = el.dataset.truck; UI.truckTab = 'costs'; UI.panel = null; return render(); }
  if (el.dataset.ttab) { UI.truckTab = el.dataset.ttab; return render(); }
  if (el.dataset.period) { UI.period = el.dataset.period; return render(); }
  if (el.dataset.open) { const [t, id] = el.dataset.open.split(':'); openPanel(t, id); return render(); }
  if (el.dataset.make) { const d = UI.panel; const m = el.dataset.make; const p = d.editId && part(d.editId);
    if (p?.openPm && d.makes.includes(m) && p.openPm.includes('968') && m === 'Volvo') { d.block = { ...(d.block ?? {}), fits: 'Truck 968 (Volvo) has this part in its PM in progress. Remove Volvo after that PM is finished.' }; return render(); }
    d.makes = d.makes.includes(m) ? d.makes.filter((x) => x !== m) : [...d.makes, m]; d.dirty = true; return render(); }
  if (el.dataset.vk) { UI.panel[el.dataset.vk] = !UI.panel[el.dataset.vk]; UI.panel.dirty = true; return render(); }
  const d = UI.panel;
  switch (el.dataset.act) {
    case 'drawer': UI.drawer = !UI.drawer; return render();
    case 'retry': UI.state = 'ok'; return render();
    case 'clear-filters': UI.q = ''; UI.fVendor = ''; UI.fTruck = ''; UI.fPeriod = 'all'; return render();
    case 'new-purchase': UI.panel = newPurchaseDraft(el.dataset.forTruck ?? ''); return render();
    case 'new-repair': UI.panel = newRepairDraft(el.dataset.forTruck ?? ''); return render();
    case 'new-part': UI.panel = partDraft(null); return render();
    case 'new-vendor': UI.panel = vendorDraft(null); return render();
    case 'close': return closePanel();
    case 'keep': UI.dialog = null; return render();
    case 'discard': UI.dialog = null; UI.panel = null; return render();
    case 'menu': UI.menu = !UI.menu; return render();
    case 'edit': editFromView(); return render();
    case 'ask-void': { UI.menu = false; const rec = d.type === 'purchaseView' ? S.purchases.find((x) => x.id === d.id) : S.repairs.find((x) => x.id === d.id); UI.dialog = { kind: 'void', rec }; return render(); }
    case 'void': { const reason = document.getElementById('void-reason').value.trim(); if (!reason) { UI.dialog.err = true; return render(); } UI.dialog.rec.voided = { on: TODAY, reason }; UI.dialog = null; return toast('ok', 'Voided. The truck costs were updated.'); }
    case 'add-line': d.lines.push(blankLine(d.truck)); d.dirty = true; return render();
    case 'del-line': d.lines.splice(Number(el.dataset.i), 1); d.dirty = true; return render();
    case 'pick-file': d.file = { name: d.type === 'repairForm' ? 'DieselPro-invoice.pdf' : 'FleetPride-invoice.pdf', size: '284 KB', progress: 10 }; d.dirty = true; render();
      [40, 75, 100].forEach((v, i) => setTimeout(() => { if (UI.panel === d && d.file) { d.file.progress = v; render(); } }, 250 * (i + 1))); return;
    case 'remove-file': d.file = null; return render();
    case 'open-file': return toast('info', 'Opens the invoice with a 5-minute signed link (Supabase Storage, private bucket).');
    case 'open-wo': return toast('info', 'Opens the Work Order at that Job.');
    case 'save': return doSave();
  }
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.filter && el.tagName === 'INPUT' && el.type !== 'checkbox') { UI[el.dataset.filter] = el.value; UI.focus = el.id; return render(); }
  const d = UI.panel; if (!d) return;
  if (el.dataset.line != null && el.tagName === 'INPUT') { d.lines[Number(el.dataset.line)][el.dataset.lf] = el.value; d.dirty = true; return updateTotals(); }
  if (el.dataset.f && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') && !['checkbox', 'radio'].includes(el.type)) { d[el.dataset.f] = el.value; d.dirty = true; if (['tax', 'freight'].includes(el.dataset.f)) updateTotals(); }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && !['checkbox', 'radio'].includes(el.type))) return;
  if (el.dataset.filter) { UI[el.dataset.filter] = el.type === 'checkbox' ? el.checked : el.value; return render(); }
  const d = UI.panel; if (!d) return;
  if (el.dataset.line != null && el.tagName === 'SELECT') {
    const l = d.lines[Number(el.dataset.line)];
    if (el.dataset.lf === 'part') { l.other = el.value === '__other'; l.part = l.other ? '' : el.value; prefillCost(d, Number(el.dataset.line)); } else l[el.dataset.lf] = el.value;
    d.dirty = true; return render();
  }
  if (!el.dataset.f) return;
  const k = el.dataset.f;
  if (el.type === 'checkbox') {
    if (k === 'active' && d.type === 'partForm' && !el.checked && d.editId && part(d.editId).openPm) { d.block = { active: `Used in the PM in progress on ${part(d.editId).openPm}. Make it inactive after that PM is finished.` }; return render(); }
    d[k] = el.checked; if (k === 'split') d.lines.forEach((l) => { l.truck = d.truck; });
  } else if (el.type === 'radio') d[k] = k === 'allFits' ? el.value === '1' : el.value;
  else d[k] = el.value;
  if (k === 'truck' && d.type === 'purchaseForm') d.lines.forEach((l) => { l.truck = el.value; });
  if (k === 'truck' && d.type === 'repairForm') d.job = (EXT_JOBS[el.value] ?? [])[0]?.id ?? '';
  d.dirty = true; render();
});
// The duplicate-invoice check runs when the Manager leaves Vendor or Invoice #.
document.addEventListener('focusout', (e) => {
  const d = UI.panel; if (!d || !['purchaseForm', 'repairForm'].includes(d.type) || !['inv', 'vendorText'].includes(e.target.id)) return;
  const v = S.vendors.find((x) => x.name.toLowerCase() === d.vendorText.trim().toLowerCase());
  d.dupe = v ? findDupe(v.id, d.inv, d.editId) : null;
  // Update only the two hints, so a click on Save right after typing is not lost to a re-render.
  const box = document.getElementById('dupebox'); if (box) box.innerHTML = dupeBox(d);
  const hint = document.getElementById('vhint'); if (hint) hint.innerHTML = vendorHint(d);
  lucide.createIcons();
});

const PRESETS = {
  purchases: ['Purchases', () => {}],
  first: ['First use', () => { S.vendors = []; S.purchases = []; S.repairs = []; S.parts.forEach((p) => { p.cost = null; p.vendor = null; }); UI.route = 'parts'; }],
  newp: ['New purchase', () => { UI.panel = newPurchaseDraft(); }],
  dupe: ['Duplicate invoice', () => { const d = newPurchaseDraft(); Object.assign(d, { vendorText: 'FleetPride', inv: '88412093', dirty: true, lines: [{ part: 'p7', other: false, desc: '', qty: '4', cost: '41.80', truck: '' }] }); d.dupe = findDupe('v1', '88412093'); UI.panel = d; }],
  stock: ['No truck (stock)', () => { const d = newPurchaseDraft(); Object.assign(d, { vendorText: 'Rush Truck Center', inv: 'RTC-560044', dirty: true, lines: [{ part: '', other: true, desc: 'Bendix brake pads, axle set', qty: '2', cost: '142.00', truck: '' }, { part: 'p16', other: false, desc: '', qty: '3', cost: '61.50', truck: '' }], tax: '25.30' }); UI.panel = d; }],
  split: ['Split by truck', () => { const d = newPurchaseDraft(); Object.assign(d, { vendorText: 'TruckPro', inv: '7731-0107', split: true, dirty: true, file: { name: 'TruckPro_7731-0107.pdf', size: '198 KB', progress: 100 }, lines: [{ part: 'p9', other: false, desc: '', qty: '1', cost: '38.75', truck: '606' }, { part: 'p3', other: false, desc: '', qty: '1', cost: '22.95', truck: '606' }, { part: 'p14', other: false, desc: '', qty: '1', cost: '22.40', truck: '918' }], tax: '6.51', freight: '12.00' }); UI.panel = d; }],
  repairs: ['Outside repairs', () => { UI.route = 'repairs'; }],
  fromjob: ['Repair from Job', () => { S.repairs = S.repairs.filter((r) => r.id !== 'r1'); UI.route = 'repairs'; UI.panel = { ...newRepairDraft('601', 'j1', true), vendorText: 'Diesel Pro (Barstow)' }; }],
  parts: ['Parts', () => { UI.route = 'parts'; }],
  inpm: ['Part in a PM', () => { UI.route = 'parts'; UI.panel = partDraft(part('p5')); UI.panel.block = { active: 'Used in the PM in progress on Truck 968 · WO-016. Make it inactive after that PM is finished.' }; }],
  vendors: ['Vendors', () => { UI.route = 'vendors'; }],
  costs: ['Truck 601 → Costs', () => { UI.route = 'truck'; UI.truck = '601'; }],
  nocost: ['Truck without costs', () => { UI.route = 'truck'; UI.truck = '612'; UI.period = 'all'; }],
  loading: ['Loading', () => { UI.state = 'loading'; }],
  error: ['Error', () => { UI.state = 'error'; }],
};
render();
</script>
</body>
