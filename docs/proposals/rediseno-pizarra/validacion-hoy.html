<style>
/* Layout: one prototype shell; a screen picker on top, each screen built from the app's own tokens

:root {
  --background: oklch(1 0 0); --foreground: oklch(0.23 0.0038 106.69);

  --muted-foreground: oklch(0.5 0.0407 257.42); --primary: oklch(0.5358 0.1444 248.04);
  --primary-text: oklch(0.48 0.14 248); --primary-foreground: oklch(1 0 0);
  --accent: oklch(0.9514 0.025 236.82); --border: oklch(0.9288 0.0126 255.51);
  --input: oklch(0.64 0.02 256); --ring: oklch(0.5358 0.1444 248.04);
  --success: oklch(0.48 0.13 151); --warning: oklch(0.74 0.15 80);
  --warning-foreground: oklch(0.38 0.09 72); --warning-surface: oklch(0.965 0.035 92);
  --destructive-text: oklch(0.5 0.19 27); --sunken: oklch(0.965 0.006 247.9);
  --note: oklch(0.97 0.03 95); --note-border: oklch(0.85 0.08 90);
  --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --radius: 0.375rem;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --background: oklch(0.2077 0.0398 265.75); --foreground: oklch(0.9842 0.0034 247.86);
  --card: oklch(0.2795 0.0368 260.03); --muted: oklch(0.31 0.037 259);
  --muted-foreground: oklch(0.7107 0.0351 256.79); --primary: oklch(0.7535 0.139 232.66);
  --primary-text: oklch(0.7535 0.139 232.66); --primary-foreground: oklch(0.2077 0.0398 265.75);
  --accent: oklch(0.33 0.04 258); --border: oklch(0.3717 0.0392 257.29); --input: oklch(0.55 0.035 257);
  --ring: oklch(0.7535 0.139 232.66); --success: oklch(0.72 0.14 151); --warning: oklch(0.82 0.14 91.6);
  --warning-foreground: oklch(0.92 0.12 91.6); --warning-surface: oklch(0.29 0.05 78);
  --destructive-text: oklch(0.78 0.12 22); --sunken: oklch(0.24 0.038 263);
  --note: oklch(0.3 0.04 85); --note-border: oklch(0.45 0.07 85); color-scheme: dark; } }
:root[data-theme="dark"] {
  --background: oklch(0.2077 0.0398 265.75); --foreground: oklch(0.9842 0.0034 247.86);
  --card: oklch(0.2795 0.0368 260.03); --muted: oklch(0.31 0.037 259);
  --muted-foreground: oklch(0.7107 0.0351 256.79); --primary: oklch(0.7535 0.139 232.66);
  --primary-text: oklch(0.7535 0.139 232.66); --primary-foreground: oklch(0.2077 0.0398 265.75);
  --accent: oklch(0.33 0.04 258); --border: oklch(0.3717 0.0392 257.29); --input: oklch(0.55 0.035 257);
  --ring: oklch(0.7535 0.139 232.66); --success: oklch(0.72 0.14 151); --warning: oklch(0.82 0.14 91.6);
  --warning-foreground: oklch(0.92 0.12 91.6); --warning-surface: oklch(0.29 0.05 78);
  --destructive-text: oklch(0.78 0.12 22); --sunken: oklch(0.24 0.038 263);
  --note: oklch(0.3 0.04 85); --note-border: oklch(0.45 0.07 85); color-scheme: dark; }

*, *::before, *::after { box-sizing: border-box; border-color: var(--border); }
body { margin: 0; background: var(--background); color: var(--foreground); font-family: var(--font-sans);
  font-size: 14px; letter-spacing: -0.01em; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--background); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
svg.lucide { width: 16px; height: 16px; stroke-width: 2; flex-shrink: 0; }
.tnum { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); }
.muted { color: var(--muted-foreground); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Prototype chrome */
.proto { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--background); border-bottom: 1px solid var(--border); }
.proto-in { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-block: 10px; max-width: 1600px; margin: 0 auto; }
.proto-title { font-weight: 600; margin-right: 8px; }
.proto-title small { display: block; font-weight: 400; font-size: 12px; color: var(--muted-foreground); }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.tab { border: 1px solid var(--border); background: var(--card); border-radius: var(--radius); padding: 6px 10px; min-height: 36px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.tab[aria-pressed="true"] { border-color: var(--primary); background: color-mix(in oklch, var(--primary) 15%, transparent); color: var(--primary-text); font-weight: 600; }
.tab .role { font-size: 11px; color: var(--muted-foreground); font-weight: 500; }
.spacer { flex: 1; }
.ghost { border: 1px solid var(--input); background: transparent; border-radius: var(--radius); padding: 6px 10px; min-height: 36px; cursor: pointer; font-size: 13px; color: var(--muted-foreground); }

main { max-width: 1600px; margin: 0 auto; padding-block: 20px 48px; }
.screen[hidden] { display: none; }
.why { margin-top: 24px; border: 1px dashed var(--note-border); background: var(--note); border-radius: var(--radius); padding: 12px 14px; font-size: 13px; }
.why b { font-weight: 600; }
.why ul { margin: 6px 0 0; padding-left: 18px; }
.why li { margin: 2px 0; }

/* App look */
.app-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; }
.app-head h1 { font-size: 24px; font-weight: 600; margin: 0; text-wrap: balance; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--success); }
.live i { width: 8px; height: 8px; border-radius: 9999px; background: var(--success); display: inline-block; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: var(--radius); border: 1px solid var(--input); background: var(--background); cursor: pointer; font-weight: 500; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
.btn.sm { min-height: 36px; padding: 0 10px; font-size: 13px; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.btn.block { width: 100%; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: calc(var(--radius) + 2px); }
.card-pad { padding: 16px; }
.section-title { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
.group-title { font-size: 14px; font-weight: 600; margin: 0; }
.badge { display: inline-flex; align-items: center; gap: 4px; min-height: 22px; border-radius: 6px; border: 1px solid var(--border); padding: 1px 7px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.b-info { border-color: color-mix(in oklch, var(--primary) 30%, transparent); background: color-mix(in oklch, var(--primary) 10%, transparent); color: var(--primary-text); }
.b-ok { border-color: color-mix(in oklch, var(--success) 40%, transparent); background: color-mix(in oklch, var(--success) 10%, transparent); color: var(--success); }
.b-warn { border-color: color-mix(in oklch, var(--warning) 55%, transparent); background: var(--warning-surface); color: var(--warning-foreground); }
.b-stop { border-color: color-mix(in oklch, var(--destructive-text) 45%, transparent); background: color-mix(in oklch, var(--destructive-text) 12%, transparent); color: var(--destructive-text); }
.b-out { color: var(--muted-foreground); }
.star { color: var(--warning-foreground); font-size: 16px; line-height: 1; }
.col.side .badge { white-space: normal; }
@media (max-width: 700px) { .proto { position: static; } .tab .role { display: none; } }
.avatar { display: inline-flex; width: 22px; height: 22px; align-items: center; justify-content: center; border-radius: 9999px; font-size: 10px; font-weight: 600; background: color-mix(in oklch, var(--primary) 18%, transparent); color: var(--primary-text); }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--input); border-radius: var(--radius); padding: 0 10px; min-height: 40px; background: var(--background); }
.search input { border: 0; outline: 0; background: transparent; font: inherit; color: inherit; width: 140px; }

/* Needs-your-decision strip */
.decide { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); cursor: pointer; }
.chip b { font-size: 18px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { border-color: var(--primary); background: color-mix(in oklch, var(--primary) 12%, transparent); }
.chip.zero { opacity: 0.6; }

/* Board */
.board { display: grid; grid-template-columns: 0.8fr repeat(4, 1fr) 0.8fr; gap: 10px; align-items: start; }
.col { background: var(--sunken); border: 1px solid var(--border); border-radius: calc(var(--radius) + 2px); min-width: 0; }
.col-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.col-head .count { margin-left: auto; font-size: 12px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
.col-body { display: flex; flex-direction: column; gap: 8px; padding: 8px; }
.col.side .col-head .group-title { color: var(--muted-foreground); }
.jcard { background: var(--background); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; text-align: left; cursor: pointer; width: 100%; }
.jcard .top { display: flex; align-items: center; gap: 6px; }
.jcard .num { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.jcard .job { font-size: 13px; }
.jcard .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--muted-foreground); }
.jcard.blocked { border-left: 3px solid var(--warning-foreground); background: color-mix(in oklch, var(--warning-surface) 60%, var(--background)); }
.jcard.hl { outline: 2px solid var(--primary); outline-offset: 1px; }
.jcard.dim { opacity: 0.35; }
.done-list { padding: 0 8px 8px; }
.done-list summary { cursor: pointer; font-size: 12px; color: var(--muted-foreground); padding: 4px 2px; }
.done-item { font-size: 13px; color: var(--muted-foreground); text-decoration: line-through; padding: 2px 2px; }
.empty { font-size: 12px; color: var(--muted-foreground); padding: 8px 4px; }
.jump { display: none; }
@media (max-width: 1000px) {
  .board { grid-template-columns: 1fr; }
  .jump { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 4px; }
  .jump a { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border: 1px solid var(--border); border-radius: 9999px; background: var(--card); color: inherit; text-decoration: none; font-size: 13px; }
  .col { scroll-margin-top: 12px; }
}

/* Two-column page */
.qcsplit { grid-template-columns: minmax(0, 320px) minmax(0, 1fr) !important; }
@media (max-width: 900px) { .qcsplit { grid-template-columns: 1fr !important; } }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
@media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.row:last-child { border-bottom: 0; }
.row .grow { flex: 1; min-width: 160px; }
.row .sub { font-size: 12px; color: var(--muted-foreground); }

/* Visit form */
.seg { display: inline-flex; border: 1px solid var(--input); border-radius: var(--radius); overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 0 14px; min-height: 44px; cursor: pointer; border-right: 1px solid var(--border); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: color-mix(in oklch, var(--primary) 15%, transparent); color: var(--primary-text); font-weight: 600; }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.check input { width: 20px; height: 20px; accent-color: var(--primary); }
select, .field { font: inherit; color: inherit; background: var(--background); border: 1px solid var(--input); border-radius: var(--radius); min-height: 40px; padding: 0 8px; }

/* Phone frame */
.phones { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
.phone { width: 390px; max-width: 100%; border: 1px solid var(--border); border-radius: 28px; padding: 14px; background: var(--background); box-shadow: 0 8px 30px color-mix(in oklch, var(--foreground) 10%, transparent); }
.phone-bar { display: flex; align-items: center; gap: 8px; padding: 4px 4px 12px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
.phone-bar .name { font-weight: 600; }
.mcard { border: 1px solid var(--border); border-radius: calc(var(--radius) + 2px); background: var(--card); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.mcard .num { font-size: 22px; font-weight: 700; }
.mcard .acts { display: flex; gap: 8px; }
.mcard .acts .btn { flex: 1; }
.mlist { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
.mtabs { display: flex; border-top: 1px solid var(--border); margin-top: 8px; padding-top: 8px; }
.mtabs span { flex: 1; text-align: center; font-size: 12px; color: var(--muted-foreground); padding: 6px 0; }
.mtabs span.on { color: var(--primary-text); font-weight: 600; }
.sheet { border: 1px solid var(--border); border-radius: calc(var(--radius) + 4px); background: var(--background); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; align-items: center; gap: 10px; min-height: 52px; border: 1px solid var(--input); border-radius: var(--radius); padding: 0 12px; background: var(--card); cursor: pointer; text-align: left; width: 100%; }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.kpi { padding: 16px; }
.kpi .v { font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.kpi .l { font-weight: 600; }
.kpi .c { font-size: 12px; color: var(--muted-foreground); margin-top: 4px; }

.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--foreground); color: var(--background); padding: 10px 14px; border-radius: var(--radius); font-size: 13px; z-index: 30; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .jcard, .chip, .tab { transition: background-color .15s, border-color .15s, opacity .15s; } }
</style>

const WARN_MILES = 30000; // owner, 2026-10-26: the warning; from here the Manager decides by how close it is to 40,000
const SUSPECT_MILES = 120000; // supuesto: more than 3x the interval reads as a data error, not a PM

  checked: ['Checked In', 'nx-checked'], wip: ['Work in Progress', 'nx-wip'], heavy: ['Heavy Work No ETA', 'nx-heavy'],

  const mech = [{ t: 845, who: 'ale1', working: true, since: '1 day 10:19' }, { t: 879, who: 'ale1', working: true, since: '1 day 10:18' }, { t: 834, who: 'anthony', working: false }];
  const returns = [[906, 'Oct 26', 57478], [907, 'Oct 26', 58383], [927, 'Nov 2', 61751], [954, 'Nov 2', 38825], [961, 'Nov 2', 35744], [899, 'Nov 6', 52981],

/* The owner's rule (2026-10-26): under 30,000 → fuel filter only; 30,000 to 40,000 → warning, the Manager decides by how close it is; 40,000 or more → PM (oil + filters). */
function pmKind(miles) {
  if (miles == null) return { kind: 'unknown', label: 'Last PM unknown · check', cls: 'b-warn' };
  if (miles >= SUSPECT_MILES) return { kind: 'check', label: `Check last PM · ${fmt(miles)} mi`, cls: 'b-stop' };
  if (miles >= PM_MILES) return { kind: 'pm', label: `PM · ${fmt(miles)} mi`, cls: 'b-info' };
  if (miles >= WARN_MILES) return { kind: 'decide', label: `Decide PM · ${fmt(miles)} mi · ${fmt(PM_MILES - miles)} to 40,000`, cls: 'b-warn' };
  return { kind: 'ff', label: `Fuel filter · ${fmt(miles)} mi`, cls: 'b-ok' };
}
function mechOn(t) { return S.mech.find((m) => m.t === t); }
