<style>
/* Layout: one prototype shell; a screen picker on top, each screen built from the app's own tokens
   (apps/web/src/app/globals.css). The board is the whiteboard: one column per trade, one card per Job. */
:root {
  --background: oklch(1 0 0); --foreground: oklch(0.23 0.0038 106.69);
  --card: oklch(0.9842 0.0034 247.86); --muted: oklch(0.9683 0.0069 247.9);
  --muted-foreground: oklch(0.5 0.0407 257.42); --primary: oklch(0.5358 0.1444 248.04);
  --primary-text: oklch(0.48 0.14 248); --primary-foreground: oklch(1 0 0);
  --accent: oklch(0.9514 0.025 236.82); --border: oklch(0.9288 0.0126 255.51);
  --input: oklch(0.64 0.02 256); --ring: oklch(0.5358 0.1444 248.04);
  --success: oklch(0.48 0.13 151); --warning: oklch(0.74 0.15 80);
  --warning-foreground: oklch(0.38 0.09 72); --warning-surface: oklch(0.965 0.035 92);
  --destructive-text: oklch(0.5 0.19 27); --sunken: oklch(0.965 0.006 247.9);
  --note: oklch(0.97 0.03 95); --note-border: oklch(0.85 0.08 90);
  --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --radius: 0.375rem;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --background: oklch(0.2077 0.0398 265.75); --foreground: oklch(0.9842 0.0034 247.86);
  --card: oklch(0.2795 0.0368 260.03); --muted: oklch(0.31 0.037 259);
  --muted-foreground: oklch(0.7107 0.0351 256.79); --primary: oklch(0.7535 0.139 232.66);
  --primary-text: oklch(0.7535 0.139 232.66); --primary-foreground: oklch(0.2077 0.0398 265.75);
  --accent: oklch(0.33 0.04 258); --border: oklch(0.3717 0.0392 257.29); --input: oklch(0.55 0.035 257);
  --ring: oklch(0.7535 0.139 232.66); --success: oklch(0.72 0.14 151); --warning: oklch(0.82 0.14 91.6);
  --warning-foreground: oklch(0.92 0.12 91.6); --warning-surface: oklch(0.29 0.05 78);
  --destructive-text: oklch(0.78 0.12 22); --sunken: oklch(0.24 0.038 263);
  --note: oklch(0.3 0.04 85); --note-border: oklch(0.45 0.07 85); color-scheme: dark; } }
:root[data-theme="dark"] {
  --background: oklch(0.2077 0.0398 265.75); --foreground: oklch(0.9842 0.0034 247.86);
  --card: oklch(0.2795 0.0368 260.03); --muted: oklch(0.31 0.037 259);
  --muted-foreground: oklch(0.7107 0.0351 256.79); --primary: oklch(0.7535 0.139 232.66);
  --primary-text: oklch(0.7535 0.139 232.66); --primary-foreground: oklch(0.2077 0.0398 265.75);
  --accent: oklch(0.33 0.04 258); --border: oklch(0.3717 0.0392 257.29); --input: oklch(0.55 0.035 257);
  --ring: oklch(0.7535 0.139 232.66); --success: oklch(0.72 0.14 151); --warning: oklch(0.82 0.14 91.6);
  --warning-foreground: oklch(0.92 0.12 91.6); --warning-surface: oklch(0.29 0.05 78);
  --destructive-text: oklch(0.78 0.12 22); --sunken: oklch(0.24 0.038 263);
  --note: oklch(0.3 0.04 85); --note-border: oklch(0.45 0.07 85); color-scheme: dark; }

*, *::before, *::after { box-sizing: border-box; border-color: var(--border); }
body { margin: 0; background: var(--background); color: var(--foreground); font-family: var(--font-sans);
  font-size: 14px; letter-spacing: -0.01em; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--background); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
svg.lucide { width: 16px; height: 16px; stroke-width: 2; flex-shrink: 0; }
.tnum { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); }
.muted { color: var(--muted-foreground); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Prototype chrome */
.proto { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--background); border-bottom: 1px solid var(--border); }
.proto-in { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-block: 10px; max-width: 1600px; margin: 0 auto; }
.proto-title { font-weight: 600; margin-right: 8px; }
.proto-title small { display: block; font-weight: 400; font-size: 12px; color: var(--muted-foreground); }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.tab { border: 1px solid var(--border); background: var(--card); border-radius: var(--radius); padding: 6px 10px; min-height: 36px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.tab[aria-pressed="true"] { border-color: var(--primary); background: color-mix(in oklch, var(--primary) 15%, transparent); color: var(--primary-text); font-weight: 600; }
.tab .role { font-size: 11px; color: var(--muted-foreground); font-weight: 500; }
.spacer { flex: 1; }
.ghost { border: 1px solid var(--input); background: transparent; border-radius: var(--radius); padding: 6px 10px; min-height: 36px; cursor: pointer; font-size: 13px; color: var(--muted-foreground); }

main { max-width: 1600px; margin: 0 auto; padding-block: 20px 48px; }
.screen[hidden] { display: none; }
.why { margin-top: 24px; border: 1px dashed var(--note-border); background: var(--note); border-radius: var(--radius); padding: 12px 14px; font-size: 13px; }
.why b { font-weight: 600; }
.why ul { margin: 6px 0 0; padding-left: 18px; }
.why li { margin: 2px 0; }

/* App look */
.app-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; }
.app-head h1 { font-size: 24px; font-weight: 600; margin: 0; text-wrap: balance; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--success); }
.live i { width: 8px; height: 8px; border-radius: 9999px; background: var(--success); display: inline-block; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: var(--radius); border: 1px solid var(--input); background: var(--background); cursor: pointer; font-weight: 500; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
.btn.sm { min-height: 36px; padding: 0 10px; font-size: 13px; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.btn.block { width: 100%; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: calc(var(--radius) + 2px); }
.card-pad { padding: 16px; }
.section-title { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
.group-title { font-size: 14px; font-weight: 600; margin: 0; }
.badge { display: inline-flex; align-items: center; gap: 4px; min-height: 22px; border-radius: 6px; border: 1px solid var(--border); padding: 1px 7px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.b-info { border-color: color-mix(in oklch, var(--primary) 30%, transparent); background: color-mix(in oklch, var(--primary) 10%, transparent); color: var(--primary-text); }
.b-ok { border-color: color-mix(in oklch, var(--success) 40%, transparent); background: color-mix(in oklch, var(--success) 10%, transparent); color: var(--success); }
.b-warn { border-color: color-mix(in oklch, var(--warning) 55%, transparent); background: var(--warning-surface); color: var(--warning-foreground); }
.b-stop { border-color: color-mix(in oklch, var(--destructive-text) 45%, transparent); background: color-mix(in oklch, var(--destructive-text) 12%, transparent); color: var(--destructive-text); }
.b-out { color: var(--muted-foreground); }
.star { color: var(--warning-foreground); font-size: 16px; line-height: 1; }
.col.side .badge { white-space: normal; }
@media (max-width: 700px) { .proto { position: static; } .tab .role { display: none; } }
.avatar { display: inline-flex; width: 22px; height: 22px; align-items: center; justify-content: center; border-radius: 9999px; font-size: 10px; font-weight: 600; background: color-mix(in oklch, var(--primary) 18%, transparent); color: var(--primary-text); }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--input); border-radius: var(--radius); padding: 0 10px; min-height: 40px; background: var(--background); }
.search input { border: 0; outline: 0; background: transparent; font: inherit; color: inherit; width: 140px; }

/* Needs-your-decision strip */
.decide { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); cursor: pointer; }
.chip b { font-size: 18px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { border-color: var(--primary); background: color-mix(in oklch, var(--primary) 12%, transparent); }
.chip.zero { opacity: 0.6; }

/* Board */
.board { display: grid; grid-template-columns: 0.8fr repeat(4, 1fr) 0.8fr; gap: 10px; align-items: start; }
.col { background: var(--sunken); border: 1px solid var(--border); border-radius: calc(var(--radius) + 2px); min-width: 0; }
.col-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.col-head .count { margin-left: auto; font-size: 12px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
.col-body { display: flex; flex-direction: column; gap: 8px; padding: 8px; }
.col.side .col-head .group-title { color: var(--muted-foreground); }
.jcard { background: var(--background); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; text-align: left; cursor: pointer; width: 100%; }
.jcard .top { display: flex; align-items: center; gap: 6px; }
.jcard .num { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.jcard .job { font-size: 13px; }
.jcard .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--muted-foreground); }
.jcard.blocked { border-left: 3px solid var(--warning-foreground); background: color-mix(in oklch, var(--warning-surface) 60%, var(--background)); }
.jcard.hl { outline: 2px solid var(--primary); outline-offset: 1px; }
.jcard.dim { opacity: 0.35; }
.done-list { padding: 0 8px 8px; }
.done-list summary { cursor: pointer; font-size: 12px; color: var(--muted-foreground); padding: 4px 2px; }
.done-item { font-size: 13px; color: var(--muted-foreground); text-decoration: line-through; padding: 2px 2px; }
.empty { font-size: 12px; color: var(--muted-foreground); padding: 8px 4px; }
.jump { display: none; }
@media (max-width: 1000px) {
  .board { grid-template-columns: 1fr; }
  .jump { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 4px; }
  .jump a { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border: 1px solid var(--border); border-radius: 9999px; background: var(--card); color: inherit; text-decoration: none; font-size: 13px; }
  .col { scroll-margin-top: 12px; }
}

/* Two-column page */
.qcsplit { grid-template-columns: minmax(0, 320px) minmax(0, 1fr) !important; }
@media (max-width: 900px) { .qcsplit { grid-template-columns: 1fr !important; } }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
@media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.row:last-child { border-bottom: 0; }
.row .grow { flex: 1; min-width: 160px; }
.row .sub { font-size: 12px; color: var(--muted-foreground); }

/* Visit form */
.seg { display: inline-flex; border: 1px solid var(--input); border-radius: var(--radius); overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 0 14px; min-height: 44px; cursor: pointer; border-right: 1px solid var(--border); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: color-mix(in oklch, var(--primary) 15%, transparent); color: var(--primary-text); font-weight: 600; }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.check input { width: 20px; height: 20px; accent-color: var(--primary); }
select, .field { font: inherit; color: inherit; background: var(--background); border: 1px solid var(--input); border-radius: var(--radius); min-height: 40px; padding: 0 8px; }

/* Phone frame */
.phones { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
.phone { width: 390px; max-width: 100%; border: 1px solid var(--border); border-radius: 28px; padding: 14px; background: var(--background); box-shadow: 0 8px 30px color-mix(in oklch, var(--foreground) 10%, transparent); }
.phone-bar { display: flex; align-items: center; gap: 8px; padding: 4px 4px 12px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
.phone-bar .name { font-weight: 600; }
.mcard { border: 1px solid var(--border); border-radius: calc(var(--radius) + 2px); background: var(--card); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.mcard .num { font-size: 22px; font-weight: 700; }
.mcard .acts { display: flex; gap: 8px; }
.mcard .acts .btn { flex: 1; }
.mlist { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
.mtabs { display: flex; border-top: 1px solid var(--border); margin-top: 8px; padding-top: 8px; }
.mtabs span { flex: 1; text-align: center; font-size: 12px; color: var(--muted-foreground); padding: 6px 0; }
.mtabs span.on { color: var(--primary-text); font-weight: 600; }
.sheet { border: 1px solid var(--border); border-radius: calc(var(--radius) + 4px); background: var(--background); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; align-items: center; gap: 10px; min-height: 52px; border: 1px solid var(--input); border-radius: var(--radius); padding: 0 12px; background: var(--card); cursor: pointer; text-align: left; width: 100%; }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.kpi { padding: 16px; }
.kpi .v { font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.kpi .l { font-weight: 600; }
.kpi .c { font-size: 12px; color: var(--muted-foreground); margin-top: 4px; }

.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--foreground); color: var(--background); padding: 10px 14px; border-radius: var(--radius); font-size: 13px; z-index: 30; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .jcard, .chip, .tab { transition: background-color .15s, border-color .15s, opacity .15s; } }
</style>

<header class="proto">

function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 2600); }
function icons() { if (window.lucide) lucide.createIcons(); }

/* D57 §3: the truck is held by whoever has a Job in progress on it (QC never holds it). */
function holder(t) { const j = S.jobs.find((x) => x.t === t && x.st === 'progress' && x.col !== 'qc'); return j ? j.who : null; }
function openJobs(t) { return S.jobs.filter((j) => j.t === t); }
function qcState(t) {
  const tr = S.trucks[t]; if (!tr) return null;
  if (tr.qc === 'not_required' || tr.qc === 'to_decide' || tr.qc === 'passed') return tr.qc;
  if (tr.qc === 'failed') return openJobs(t).length || tr.qcWait ? 'failed' : 'ready';
  return openJobs(t).length ? 'required' : 'ready';
}
function readyToRelease(t) { const q = qcState(t); return !S.trucks[t].closed && openJobs(t).length === 0 && (q === 'not_required' || q === 'passed'); }

const ST = {
  available: ['Available', 'b-info', 'circle-dot'],
  taken: ['Taken', 'b-out', 'user-round'],
  progress: ['In progress', 'b-info', 'wrench'],
  blocked: ['Blocked', 'b-warn', 'octagon-pause'],
};
const QC = {
  not_required: ['Not required', 'b-out', 'minus-circle'],
  to_decide: ['To decide', 'b-warn', 'circle-help'],
  required: ['Required · waits for the work', 'b-out', 'shield'],
  ready: ['Ready for Safety', 'b-info', 'shield-check'],
  failed: ['Failed · corrective work open', 'b-stop', 'shield-x'],
  passed: ['Passed', 'b-ok', 'shield-check'],
};
function badge([label, cls, icon]) { return `<span class="badge ${cls}"><i data-lucide="${icon}"></i>${esc(label)}</span>`; }
function av(p) { return p ? `<span class="avatar" title="${esc(PEOPLE[p].name)}">${PEOPLE[p].ini}</span>` : ''; }

/* ---------- Board ---------- */
function decideCounts() {
  return [
    ['blocked', 'Blocked', S.jobs.filter((j) => j.st === 'blocked').length],
    ['release', 'Ready to close', Object.keys(S.trucks).filter((t) => readyToRelease(+t)).length],
    ['arrived', 'Arrived without a Work Order', S.arrivals.length],
    ['qcdecide', 'QC to decide', Object.keys(S.trucks).filter((t) => S.trucks[t].qc === 'to_decide').length],
    ['nottaken', 'Not taken > 1 day', S.jobs.filter((j) => j.st === 'available' && j.old).length],
    ['requests', 'Work requests', S.requests.length],
    ['paused', 'Paused', 0],
    ['findings', 'Safety findings to decide', 0],
  ];
}
function cardMatches(j) {
  if (S.q && !String(j.t).includes(S.q)) return false;
  if (S.filter === 'blocked') return j.st === 'blocked';
  if (S.filter === 'release' || S.filter === 'arrived' || S.filter === 'requests') return false;
  if (S.filter === 'nottaken') return j.st === 'available' && !!j.old;
  if (S.filter === 'qcdecide') return S.trucks[j.t] && S.trucks[j.t].qc === 'to_decide';
  return true;
}
function jobCard(j) {
  const tr = S.trucks[j.t];
  const h = holder(j.t);
  const busy = j.st === 'available' && h && h !== j.who;
  const status = busy ? badge([`With ${PEOPLE[h].name}`, 'b-out', 'lock']) : badge(ST[j.st]);
  const who = j.who && !busy ? `${av(j.who)}<span>${esc(PEOPLE[j.who].name)}</span>` : '';
  const extra = j.st === 'blocked' ? `<span>${esc(j.why)}</span>` : (j.from ? `<span>${esc(j.from)}</span>` : '');
  const cls = ['jcard', j.st === 'blocked' ? 'blocked' : '', S.q && String(j.t).includes(S.q) ? 'hl' : '', cardMatches(j) ? '' : 'dim'].join(' ');
  return `<button type="button" class="${cls}" data-truck="${j.t}" aria-label="Truck ${j.t}, ${esc(j.name)}, ${esc(busy ? 'with ' + PEOPLE[h].name : ST[j.st][0])}">
    <span class="top"><span class="num">${j.t}</span>${tr && tr.star ? '<span class="star" role="img" aria-label="High priority">★</span>' : ''}<span class="spacer"></span>${tr && tr.leaves ? `<span class="badge b-warn"><i data-lucide="calendar-clock"></i>${esc(tr.leaves)}</span>` : ''}</span>
    <span class="job">${esc(j.name)}</span>
    <span class="meta">${status}${who}${extra}</span>
  </button>`;
}
function qcCard(t) {
  const q = qcState(t); const tr = S.trucks[t];
  const cls = ['jcard', S.q && String(t).includes(S.q) ? 'hl' : '', (S.filter && !(S.filter === 'qcdecide' && q === 'to_decide')) || (S.q && !String(t).includes(S.q)) ? 'dim' : ''].join(' ');
  return `<button type="button" class="${cls}" data-truck="${t}"><span class="top"><span class="num">${t}</span>${tr.star ? '<span class="star" role="img" aria-label="High priority">★</span>' : ''}</span>
    <span class="meta">${badge(QC[q])}</span></button>`;
}
function renderBoard() {
  const order = { blocked: 0, progress: 1, taken: 2, available: 3 };
  const cols = COLS.map((c) => {
    let cards;
    if (c.key === 'qc') {
      const ts = Object.keys(S.trucks).map(Number).filter((t) => qcState(t) !== 'not_required');
      cards = ts.length ? ts.map(qcCard).join('') : '<div class="empty">No QC pending</div>';
      const nr = Object.keys(S.trucks).filter((t) => qcState(+t) === 'not_required');
      cards += nr.length ? `<div class="empty">Not required: ${nr.join(', ')}</div>` : '';
    } else {
      const js = S.jobs.filter((j) => j.col === c.key).sort((a, b) => order[a.st] - order[b.st] || (S.trucks[b.t]?.star ? 1 : 0) - (S.trucks[a.t]?.star ? 1 : 0));
      cards = js.length ? js.map(jobCard).join('') : '<div class="empty">Nothing open</div>';
    }
    const done = S.done.filter((d) => d.col === c.key);
    const n = c.key === 'qc' ? Object.keys(S.trucks).filter((t) => qcState(+t) !== 'not_required').length : S.jobs.filter((j) => j.col === c.key).length;
    return `<div class="col ${c.side ? 'side' : ''}" id="col-${c.key}"><div class="col-head"><h2 class="group-title">${c.name}</h2><span class="count">${n}</span></div>
      <div class="col-body">${cards}</div>
      ${done.length ? `<details class="done-list"><summary>Done today (${done.length})</summary>${done.map((d) => `<div class="done-item">${d.t} · ${esc(d.name)}</div>`).join('')}</details>` : ''}</div>`;
  }).join('');
  $('#s-board').innerHTML = `
    <div class="app-head"><h1 id="h-board">Shop board</h1><span class="live"><i></i>Live</span><span class="spacer"></span>
      <label class="search"><i data-lucide="search"></i><span class="sr-only" hidden>Find a truck</span><input id="q" inputmode="numeric" placeholder="Find truck" value="${esc(S.q)}" aria-label="Find a truck"></label>
      <button class="btn sm" type="button" data-go="arrivals"><i data-lucide="truck"></i>Arrivals</button>
      <button class="btn sm" type="button" title="Today's Yard board, kept as a second view"><i data-lucide="columns-3"></i>By truck</button>
      <button class="btn sm" type="button"><i data-lucide="maximize"></i>Full screen</button></div>
    <div class="decide" role="group" aria-label="Needs your decision">
      <span class="muted" style="align-self:center;font-size:13px;font-weight:600">Needs your decision</span>
      ${decideCounts().filter(([k, , n]) => n || S.filter === k).map(([k, l, n]) => `<button type="button" class="chip ${n ? '' : 'zero'}" data-filter="${k}" aria-pressed="${S.filter === k}"><b>${n}</b>${l}</button>`).join('')}
      ${S.filter ? '<button type="button" class="ghost" data-filter="">Show all</button>' : ''}
    </div>
    ${S.filter === 'release' ? releaseList() : ''}${S.filter === 'arrived' ? arrivedList() : ''}${S.filter === 'requests' ? requestList() : ''}
    <nav class="jump" aria-label="Go to a column">${COLS.map((c) => `<a href="#col-${c.key}" data-jump="${c.key}">${c.name} <b>${c.key === 'qc' ? Object.keys(S.trucks).filter((t) => qcState(+t) !== 'not_required').length : S.jobs.filter((j) => j.col === c.key).length}</b></a>`).join('')}</nav>
    <div class="board">${cols}</div>
    <div class="why"><b>Por qué así (HU-RD1, HU-RD6).</b><ul>
      <li>Una tarjeta = un trabajo. El 901 sale en PM, Repairs, Alignment, Detailing y QC, como en la pizarra física.</li>
      <li>★ = prioridad High/Critical (el asterisco de la pizarra). Blocked va arriba y en ámbar con el motivo.</li>
      <li>"With Detailing": el camión 918 lo tiene el equipo de Detailing (D57 §3, un camión a la vez). Se ve, pero no se puede tomar (P48).</li>
      <li>"Needs your decision" reemplaza la cola del Dashboard: el Manager ve excepciones, no registros. Solo salen los contadores que no están en cero (lista completa en ia-inventario.md §2). Cada número filtra la pizarra.</li>
      <li>"Repairs" es un nombre por validar con el Shop Manager (P40).</li>
      <li>Lo terminado hoy queda tachado y plegado al pie de su columna. Buscar "901" resalta todas sus tarjetas.</li>
      <li>Toca una tarjeta para abrir el camión. "By truck" conserva el tablero de hoy.</li></ul></div>`;
}
function releaseList() {
  const ts = Object.keys(S.trucks).filter((t) => readyToRelease(+t));

}

/* ---------- New Work Order (with Visit type) ---------- */
const TEMPLATES = {
  'End of contract': { inspection: true, pm: true, alignment: true, detailing: true, qc: 'required' },
  'Passing through': { inspection: false, pm: false, alignment: false, detailing: false, qc: 'to_decide' },
  'Other': { inspection: true, pm: false, alignment: false, detailing: false, qc: 'to_decide' },
};
const STEP_NAMES = { inspection: 'Arrival inspection', pm: 'PM A Service', alignment: 'Alignment', detailing: 'Detailing' };
function draftFor(t, type) {
  const tpl = TEMPLATES[type];
  return { t, type, steps: { ...tpl }, reasons: {}, qc: tpl.qc, qcWhy: '', repairs: t === 933 ? ['Headlight · left'] : [], star: false };
}

        <div class="sub muted" style="margin-top:6px">Proposed: Passing through (in the yard, not on the return list).</div></div>

      <div><h2 class="group-title" style="margin-bottom:8px">Quality Check</h2>
        <div class="seg" role="group" aria-label="Quality Check">${[['to_decide', 'Decide later'], ['required', 'Required'], ['not_required', 'Not required']].map(([k, l]) => `<button type="button" data-qc="${k}" aria-pressed="${d.qc === k}">${l}</button>`).join('')}</div>
        ${d.qc === 'not_required' ? `<input class="field" id="qcwhy" style="margin-top:8px;width:100%" placeholder="Why? (required)" value="${esc(d.qcWhy)}" aria-label="Why QC is not required">` : ''}
        <div class="sub muted" style="margin-top:6px">${d.qc === 'to_decide' ? 'The Work Order cannot be closed until someone decides.' : d.qc === 'required' ? 'Safety gets it when everything else is done.' : 'Only the Manager can set this. Saved with your name and the time.'}</div></div>

/* ---------- Mechanic ---------- */
function renderMech() {

      <li>Prueba: Take en el 612 → Return con "Mirror" → mira Repairs en Board. O Approve → el 612 queda Ready to close en Board.</li></ul></div>`;
}

/* ---------- Render + events ---------- */
const RENDER = { board: renderBoard, arrivals: renderArrivals, visit: renderVisit, truck: renderTruck, mech: renderMech, qc: renderQc, mgmt: renderMgmt };
function renderTabs() {
  $('#tabs').innerHTML = SCREENS.map(([k, l, r]) => `<button type="button" class="tab" data-go="${k}" aria-pressed="${k === screen}">${l}<span class="role">${r}</span></button>`).join('');
}
function render() {
  renderTabs();
  SCREENS.forEach(([k]) => { $('#s-' + k).hidden = k !== screen; });
  RENDER[screen]();
  icons();
}
function go(k) { screen = k; try { history.replaceState(null, '', '#' + k); } catch (e) {} render(); window.scrollTo(0, 0); }

document.addEventListener('click', (e) => {
  const jump = e.target.closest('[data-jump]');
  if (jump) { e.preventDefault(); const c = document.getElementById('col-' + jump.dataset.jump); if (c) c.scrollIntoView({ block: 'start' }); return; }
  const el = e.target.closest('button'); if (!el) return;
  const d = el.dataset;
  if (d.go) return go(d.go);
  if (d.filter !== undefined) { S.filter = S.filter === d.filter || !d.filter ? null : d.filter; return render(); }
  if (d.truck) { S.truckView = +d.truck; return go('truck'); }
  if (d.openVisit) { S.visitDraft = draftFor(+d.openVisit, 'Passing through'); return go('visit'); }
  if (d.toast) return toast(d.toast);
  if (d.reqDone !== undefined) { S.requests.splice(+d.reqDone, 1); S.filter = null; toast('Marked handled.'); return render(); }
  if (d.reqAdd !== undefined) { const r = S.requests.splice(+d.reqAdd, 1)[0]; S.jobs.push({ id: S.nextId++, t: r.t, col: 'repairs', name: 'Mirror · driver side', st: 'available', from: 'Requested by ' + r.who }); S.filter = null; toast(`Added to ${r.t}. Available in Repairs.`); return render(); }
  if (d.type) { const v = S.visitDraft; const keep = v.repairs; S.visitDraft = draftFor(v.t, d.type); S.visitDraft.repairs = keep; return render(); }
  if (d.qc) { S.visitDraft.qc = d.qc; return render(); }
  if (d.rm !== undefined) { S.visitDraft.repairs.splice(+d.rm, 1); return render(); }
  if (el.id === 'addrep') { const v = $('#newrep').value.trim(); if (v) { S.visitDraft.repairs.push(v); render(); } return; }
  if (el.id === 'openvisit') {
    const v = S.visitDraft; const t = v.t;
    S.trucks[t] = { visit: v.type, star: v.star, qc: v.qc, qcWhy: v.qcWhy, keys: 'Office', since: 'Today 10:12' };
    Object.keys(STEP_NAMES).forEach((k) => { if (v.steps[k]) S.jobs.push({ id: S.nextId++, t, col: k, name: STEP_NAMES[k], st: 'available' }); });
    v.repairs.forEach((r) => S.jobs.push({ id: S.nextId++, t, col: 'repairs', name: r, st: 'available' }));
    S.notRequired[t] = Object.keys(STEP_NAMES).filter((k) => !v.steps[k]).map((k) => [STEP_NAMES[k], v.reasons[k] || v.type]);
    S.arrivals = S.arrivals.filter((a) => a.t !== t); S.q = String(t); S.filter = null;
    toast(`Work Order open for ${t}. Its Jobs are Available on the board.`);
    return go('board');
  }
  if (d.take) {
    const j = S.jobs.find((x) => x.id === +d.take);
    if (j.st !== 'available') { toast('Someone just took it.'); return render(); }
    j.who = S.mech; j.st = S.mech === 'anthony' ? 'taken' : 'progress';
    toast(j.st === 'progress' ? `Truck ${j.t} is yours. Your time started.` : `Truck ${j.t} is yours. Tap Start when you have the keys.`);
    return render();
  }
  if (d.start) { const j = S.jobs.find((x) => x.id === +d.start); if (holder(j.t) && holder(j.t) !== S.mech) { toast(`${PEOPLE[holder(j.t)].name} is working on this truck.`); return; } j.st = 'progress'; return render(); }
  if (d.release) { const j = S.jobs.find((x) => x.id === +d.release); j.st = 'available'; delete j.who; toast('Back to Available.'); return render(); }
  if (d.block) { S.sheet = { kind: 'block', id: +d.block }; return render(); }
  if (d.reason) { const j = S.jobs.find((x) => x.id === S.sheet.id); j.st = 'blocked'; j.why = d.reason; S.sheet = null; toast('Blocked. The Manager sees it on the board.'); return render(); }
  if (d.complete) { S.sheet = { kind: 'keys', id: +d.complete }; return render(); }
  if (d.keys) {
    const j = S.jobs.find((x) => x.id === S.sheet.id);
    S.jobs = S.jobs.filter((x) => x.id !== j.id); S.done.push({ t: j.t, col: j.col, name: j.name });
    if (S.trucks[j.t]) S.trucks[j.t].keys = d.keys === 'Back at the office' ? 'Office' : d.keys === 'Left in the truck' ? 'In truck' : d.keys === 'Gave them to someone' ? 'Given to a mechanic · not confirmed' : 'Unknown';
    if (S.trucks[j.t] && S.trucks[j.t].qc === 'failed' && !openJobs(j.t).length) S.trucks[j.t].qc = 'required';
    S.sheet = null; toast(`Done: ${j.t} · ${j.name}.`); return render();
  }
  if (d.cancel !== undefined) { S.sheet = null; return render(); }
  if (d.qctab) { S.qcTab = d.qctab; return render(); }
  if (d.qcsel) { S.qcSel = +d.qcsel; S.qcSheet = null; return render(); }
  if (d.qctake) { S.qcTaken[+d.qctake] = 'me'; toast(`Truck ${d.qctake} is yours to review.`); return render(); }
  if (d.qclet) { delete S.qcTaken[+d.qclet]; S.qcSheet = null; toast('Let go. The other Safety person can take it.'); return render(); }
  if (d.qcsheet) { S.qcSheet = d.qcsheet; S.qcDraft = { note: '', job: '' }; return render(); }
  if (d.qccancel !== undefined) { S.qcSheet = null; return render(); }
  if (d.qcapprove) { const t = +d.qcapprove; S.trucks[t].qc = 'passed'; delete S.qcTaken[t]; S.qcHistory.unshift({ t, result: 'Approved', at: 'Today', note: S.qcDraft.note }); S.qcSheet = null; toast(`Truck ${t} approved. Ready to close for the Manager.`); return render(); }
  if (d.qcreturn) { const t = +d.qcreturn; const dr = S.qcDraft; S.trucks[t].qc = 'failed'; S.trucks[t].qcNote = dr.note; S.trucks[t].qcWait = !dr.job; delete S.qcTaken[t];
    if (dr.job) S.jobs.push({ id: S.nextId++, t, col: 'repairs', name: dr.job, st: 'available', from: 'QC failed' });
    S.qcHistory.unshift({ t, result: 'Returned', at: 'Today', note: dr.note }); S.qcSheet = null;
    toast(dr.job ? `Returned. "${dr.job}" is Available in Repairs.` : 'Returned. The Manager decides what to add.'); return render(); }
  if (false && d.qcret) { const t = +d.qcret; S.trucks[t].qc = 'failed'; S.trucks[t].qcNote = 'Mirror loose'; S.jobs.push({ id: S.nextId++, t, col: 'repairs', name: 'Mirror · driver side', st: 'available', from: 'QC failed' }); toast(`Returned. A corrective Job is Available in Repairs.`); return render(); }
  if (el.id === 'release') { const t = S.truckView; S.trucks[t].closed = true; toast(`Work Order closed. Truck ${t} is Ready to Go.`); return render(); }
  if (el.id === 'rts') { const t = S.truckView; delete S.trucks[t]; S.jobs = S.jobs.filter((j) => j.t !== t); toast(`Truck ${t}: Return to Service saved. It left the board.`); return render(); }
  if (el.id === 'reset') { S = seed(); toast('Example data back to the start.'); return render(); }
  if (el.id === 'theme') { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.step) { S.visitDraft.steps[el.dataset.step] = el.checked; return render(); }
  if (el.dataset.why) { S.visitDraft.reasons[el.dataset.why] = el.value; return render(); }
  if (el.id === 'vstar') { S.visitDraft.star = el.checked; return; }
  if (el.id === 'tpick') { S.truckView = +el.value; return render(); }
  if (el.id === 'mpick') { S.mech = el.value; S.sheet = null; return render(); }
  if (el.id === 'qcwhy') { S.visitDraft.qcWhy = el.value; return render(); }
  if (el.id === 'qcjob') { S.qcDraft.job = el.value; return render(); }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'qcnote') { S.qcDraft.note = e.target.value; const btn = document.querySelector('[data-qcreturn]'); if (btn) btn.disabled = !e.target.value.trim(); const h = document.getElementById('qchint'); if (h) h.hidden = !!e.target.value.trim(); return; }
  if (e.target.id === 'q') { S.q = e.target.value.replace(/\D/g, ''); const pos = e.target.selectionStart; renderBoard(); icons(); const q = $('#q'); q.focus(); try { q.setSelectionRange(pos, pos); } catch (err) {} }
});
const start = location.hash.slice(1);
if (RENDER[start]) screen = start;
render();
</script>
