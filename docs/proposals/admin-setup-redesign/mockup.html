<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Setup Proposal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* Same tokens as the other proposals (qc-screen-redesign, truck-detail-redesign) and apps/web/src/app/globals.css.
     Self-contained on purpose: no Tailwind or icon CDN, only Google Fonts. */
  :root {
    --background: oklch(1 0 0); --foreground: oklch(0.23 0.0038 106.6929);
    --card: oklch(0.9842 0.0034 247.8575); --muted: oklch(0.9683 0.0069 247.8956);
    --muted-foreground: oklch(0.5 0.0407 257.4166); --primary: oklch(0.5358 0.1444 248.0435);
    --primary-foreground: oklch(1 0 0); --accent: oklch(0.9514 0.025 236.8242);
    --border: oklch(0.9288 0.0126 255.5078); --ring: oklch(0.5358 0.1444 248.0435);
    --success: oklch(0.48 0.13 151); --warning: oklch(0.74 0.15 80);
    --warning-foreground: oklch(0.38 0.09 72); --warning-surface: oklch(0.965 0.035 92);
    --destructive: oklch(0.55 0.2 25.3313); --destructive-text: oklch(0.5 0.19 27);
    --sunken: oklch(0.965 0.006 247.9);
  }
  .dark {
    --background: oklch(0.2077 0.0398 265.7549); --foreground: oklch(0.9842 0.0034 247.8575);
    --card: oklch(0.2795 0.0368 260.031); --muted: oklch(0.31 0.037 259);
    --muted-foreground: oklch(0.7107 0.0351 256.7878); --primary: oklch(0.7535 0.139 232.6615);
    --primary-foreground: oklch(0.2077 0.0398 265.7549); --accent: oklch(0.33 0.04 258);
    --border: oklch(0.3717 0.0392 257.287); --ring: oklch(0.7535 0.139 232.6615);
    --success: oklch(0.72 0.14 151); --warning: oklch(0.82 0.14 91.6054);
    --warning-foreground: oklch(0.92 0.12 91.6054); --warning-surface: oklch(0.29 0.05 78);
    --destructive: oklch(0.3958 0.1331 25.723); --destructive-text: oklch(0.78 0.12 22);
    --sunken: oklch(0.24 0.038 263);
  }
  * { box-sizing: border-box; border-color: var(--border); }
  html, body { margin: 0; }
  body { background: var(--sunken); color: var(--foreground); font: 14px/1.45 Inter, system-ui, sans-serif; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  button:disabled { cursor: not-allowed; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  svg.i { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  svg.i.s14 { width: 14px; height: 14px; } svg.i.s20 { width: 20px; height: 20px; }
  .mono { font-family: 'JetBrains Mono', monospace; font-size: .92em; }
  .tnum { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted-foreground); }
  .small { font-size: 12px; } .b { font-weight: 600; } .m { font-weight: 500; }
  .row { display: flex; align-items: center; gap: 8px; } .wrap { flex-wrap: wrap; } .grow { flex: 1; min-width: 0; }
  .col { display: flex; flex-direction: column; gap: 4px; }
  .between { justify-content: space-between; } .end { justify-content: flex-end; }
  .gap4 { gap: 4px; } .gap12 { gap: 12px; } .gap16 { gap: 16px; }
  .mt4 { margin-top: 4px; } .mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; } .mt24 { margin-top: 24px; }
  .trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .warn-t { color: var(--warning-foreground); } .dark .warn-t { color: var(--warning); }
  .ok-t { color: var(--success); } .bad-t { color: var(--destructive-text); } .pri-t { color: var(--primary); }
  .link { color: var(--primary); } .link:hover { text-decoration: underline; }

  /* Demo bar (not part of the app) */
  .demo { position: sticky; top: 0; z-index: 90; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 16px; border-bottom: 1px solid var(--border); background: color-mix(in oklch, var(--background) 95%, transparent); backdrop-filter: blur(6px); font-size: 12px; }
  .demo .seg button, .demo > button, .demo .presets button { height: 30px; padding: 0 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--background); }
  .demo .seg { display: inline-flex; } .demo .seg button { border-radius: 0; } .demo .seg button:first-child { border-radius: 6px 0 0 6px; } .demo .seg button:last-child { border-radius: 0 6px 6px 0; border-left: 0; }
  .demo .on { background: var(--primary) !important; color: var(--primary-foreground); border-color: var(--primary) !important; }
  .demo .presets { display: flex; flex-wrap: wrap; gap: 4px; }
  .demo .grp { color: var(--muted-foreground); margin: 0 2px 0 8px; }

  #stage { display: flex; justify-content: center; padding: 24px 16px; }
  .frame { position: relative; display: flex; overflow: hidden; background: var(--background); border: 1px solid var(--border); box-shadow: 0 20px 50px -20px rgba(0,0,0,.25); }
  .frame.desk { width: 100%; max-width: 1280px; height: 800px; border-radius: 12px; }
  .frame.phone { width: 390px; height: 800px; border-radius: 32px; border-width: 4px; flex-direction: column; }

  /* Admin shell */
  .side { width: 232px; flex-shrink: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--background); }
  .brand { height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--border); }
  .logo { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 6px; background: color-mix(in oklch, var(--success) 20%, transparent); color: var(--success); }
  .nav { flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; }
  .nav p { margin: 0 0 4px; padding: 0 8px; font-size: 12px; color: var(--muted-foreground); }
  .nav a { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 8px; border-radius: 6px; color: var(--muted-foreground); cursor: pointer; }
  .nav a:hover { background: var(--accent); color: var(--foreground); }
  .nav a.cur { background: var(--accent); color: var(--foreground); font-weight: 500; }
  .nav .new { margin-left: auto; font-size: 10px; padding: 1px 6px; border-radius: 999px; background: color-mix(in oklch, var(--primary) 15%, transparent); color: var(--primary); }
  .who { border-top: 1px solid var(--border); padding: 12px 16px; }
  .body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .top { height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 20px; border-bottom: 1px solid var(--border); background: color-mix(in oklch, var(--background) 92%, transparent); }
  .phone .top { padding: 0 12px; }
  .crumb { display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--muted-foreground); white-space: nowrap; }
  .crumb a { cursor: pointer; } .crumb a:hover { color: var(--foreground); } .crumb b { color: var(--foreground); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
  .me { margin-left: auto; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 999px; background: color-mix(in oklch, var(--primary) 15%, transparent); color: var(--primary); font-size: 12px; font-weight: 600; }
  .main { flex: 1; min-height: 0; overflow-y: auto; position: relative; }
  .page { max-width: 1040px; margin: 0 auto; padding: 24px 24px 96px; }
  .phone .page { padding: 16px 16px 112px; }
  h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
  .phone h1 { font-size: 22px; }
  h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .sub { margin: 4px 0 0; color: var(--muted-foreground); }

  /* Primitives */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 6px; font-weight: 500; white-space: nowrap; }
  .phone .btn { height: 44px; }
  .btn.sm { height: 30px; padding: 0 10px; font-size: 13px; } .phone .btn.sm { height: 36px; }
  .btn.icon { width: 36px; padding: 0; } .phone .btn.icon { width: 44px; }
  .btn.primary { background: var(--primary); color: var(--primary-foreground); } .btn.primary:hover { opacity: .92; }
  .btn.outline { border: 1px solid var(--border); background: var(--background); } .btn.outline:hover { background: var(--accent); }
  .btn.ghost { color: var(--muted-foreground); } .btn.ghost:hover { background: var(--accent); color: var(--foreground); }
  .btn.danger { background: var(--destructive); color: #fff; }
  .btn.danger-o { border: 1px solid color-mix(in oklch, var(--destructive) 50%, transparent); color: var(--destructive-text); background: var(--background); }
  .btn:disabled { opacity: .45; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--border); font-size: 12px; font-weight: 500; white-space: nowrap; }
  .chip .dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; }
  .chip.ok { color: var(--success); border-color: color-mix(in oklch, var(--success) 40%, transparent); background: color-mix(in oklch, var(--success) 10%, transparent); }
  .chip.warn { color: var(--warning-foreground); border-color: color-mix(in oklch, var(--warning) 50%, transparent); background: color-mix(in oklch, var(--warning) 14%, transparent); }
  .dark .chip.warn { color: var(--warning); }
  .chip.bad { color: var(--destructive-text); border-color: color-mix(in oklch, var(--destructive) 45%, transparent); background: color-mix(in oklch, var(--destructive) 12%, transparent); }
  .chip.pri { color: var(--primary); border-color: color-mix(in oklch, var(--primary) 40%, transparent); background: color-mix(in oklch, var(--primary) 10%, transparent); }
  .chip.off { color: var(--muted-foreground); background: var(--muted); }
  .count { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 6px; background: var(--muted); box-shadow: inset 0 0 0 1px var(--border); font-size: 12px; font-weight: 500; color: var(--muted-foreground); }
  .av { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 999px; font-size: 10px; font-weight: 600; flex-shrink: 0; }
  .av.lg { width: 48px; height: 48px; font-size: 16px; }
  .t-sky { background: color-mix(in oklch, oklch(0.68 0.15 237) 22%, transparent); color: oklch(0.5 0.15 237); }
  .t-violet { background: color-mix(in oklch, oklch(0.6 0.2 293) 22%, transparent); color: oklch(0.5 0.2 293); }
  .t-emerald { background: color-mix(in oklch, oklch(0.7 0.15 162) 22%, transparent); color: oklch(0.5 0.13 162); }
  .t-rose { background: color-mix(in oklch, oklch(0.65 0.2 16) 22%, transparent); color: oklch(0.52 0.2 16); }
  .t-cyan { background: color-mix(in oklch, oklch(0.72 0.13 215) 22%, transparent); color: oklch(0.5 0.11 215); }
  .t-amber { background: color-mix(in oklch, oklch(0.77 0.16 70) 25%, transparent); color: oklch(0.5 0.13 60); }
  .t-slate { background: color-mix(in oklch, oklch(0.55 0.04 257) 22%, transparent); color: oklch(0.45 0.04 257); }
  .t-lime { background: color-mix(in oklch, oklch(0.77 0.2 131) 22%, transparent); color: oklch(0.5 0.15 131); }
  .dark [class*="t-"].av { filter: brightness(1.5); }
  .card { border: 1px solid var(--border); border-radius: 12px; background: var(--card); }
  .card-h { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .card-b { padding: 16px; }
  .divide > * + * { border-top: 1px solid var(--border); }
  .alert { display: flex; gap: 10px; padding: 10px 12px; border-radius: 8px; border: 1px solid; font-size: 13px; }
  .alert svg { margin-top: 2px; }
  .alert.warn { border-color: color-mix(in oklch, var(--warning) 50%, transparent); background: var(--warning-surface); color: var(--warning-foreground); }
  .dark .alert.warn { color: var(--warning-foreground); }
  .alert.bad { border-color: color-mix(in oklch, var(--destructive) 45%, transparent); background: color-mix(in oklch, var(--destructive) 10%, transparent); color: var(--destructive-text); }
  .alert.info { border-color: color-mix(in oklch, var(--primary) 35%, transparent); background: color-mix(in oklch, var(--primary) 8%, transparent); }
  .alert .grow > p { margin: 0; }
  .input { height: 36px; width: 100%; padding: 0 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--background); outline: none; }
  .phone .input { height: 44px; font-size: 16px; }
  .input:focus { border-color: var(--ring); }
  .input.err { border-color: var(--destructive); }
  .search { position: relative; } .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted-foreground); } .search .input { padding-left: 32px; }
  .segc { display: inline-flex; padding: 3px; border-radius: 8px; background: var(--muted); gap: 2px; }
  .segc button { height: 28px; padding: 0 10px; border-radius: 6px; color: var(--muted-foreground); font-weight: 500; font-size: 13px; }
  .phone .segc button { height: 36px; }
  .segc button.on { background: var(--background); color: var(--foreground); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-top: 16px; }
  .tabs button { height: 40px; padding: 0 12px; color: var(--muted-foreground); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button.on { color: var(--foreground); border-color: var(--primary); }

  table.t { width: 100%; border-collapse: collapse; }
  .t th { text-align: left; font-size: 12px; font-weight: 500; color: var(--muted-foreground); padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--card); }
  .t td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .t tr:last-child td { border-bottom: 0; }
  .t tr.click:hover td { background: color-mix(in oklch, var(--accent) 45%, transparent); cursor: pointer; }
  .t tr.flash td, .mcard.flash { animation: flash 1.6s ease-out; }
  @keyframes flash { from { background: color-mix(in oklch, var(--primary) 18%, transparent); } }
  .t .num { text-align: right; font-variant-numeric: tabular-nums; }
  .tablewrap { border: 1px solid var(--border); border-radius: 12px; overflow: visible; background: var(--background); }
  .tablewrap .t tr:first-child th:first-child { border-top-left-radius: 12px; } .tablewrap .t tr:first-child th:last-child { border-top-right-radius: 12px; }

  /* Popover menu */
  .rel { position: relative; }
  .menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 30; width: 260px; padding: 4px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); box-shadow: 0 12px 30px -8px rgba(0,0,0,.3); text-align: left; }
  .menu .mi { display: flex; align-items: flex-start; gap: 8px; width: 100%; padding: 8px 10px; border-radius: 6px; text-align: left; font-weight: 400; }
  .menu .mi:hover:not(:disabled) { background: var(--accent); }
  .menu .mi:disabled { opacity: 1; color: var(--muted-foreground); }
  .menu .mi small { display: block; font-size: 12px; color: var(--muted-foreground); margin-top: 1px; }
  .menu .mi.bad { color: var(--destructive-text); }
  .menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }

  /* Overlay layer inside the frame */
  .ov { position: absolute; inset: 0; z-index: 60; background: rgba(0,0,0,.5); }
  .dlg { position: absolute; z-index: 61; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, 92%); max-height: 88%; overflow-y: auto; padding: 20px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); box-shadow: 0 24px 60px -12px rgba(0,0,0,.45); animation: pop .14s ease-out; }
  .phone .dlg { left: 0; right: 0; top: auto; bottom: 0; transform: none; width: auto; max-height: 90%; border-radius: 20px 20px 0 0; animation: sheet .2s ease-out; }
  .grab { display: none; } .phone .grab { display: block; width: 40px; height: 4px; border-radius: 999px; background: color-mix(in oklch, var(--muted-foreground) 40%, transparent); margin: -6px auto 12px; }
  .dlg .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .phone .dlg .acts { flex-direction: column-reverse; } .phone .dlg .acts .btn { width: 100%; }
  @keyframes pop { from { opacity: 0; } } @keyframes sheet { from { transform: translateY(24px); opacity: 0; } }
  .toast { position: absolute; z-index: 70; left: 50%; bottom: 84px; transform: translateX(-50%); width: min(92%, 420px); display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); box-shadow: 0 12px 30px -8px rgba(0,0,0,.35); animation: pop .18s ease-out; }
  .savebar { position: sticky; bottom: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 12px 24px; border-top: 1px solid var(--border); background: var(--card); box-shadow: 0 -8px 24px -12px rgba(0,0,0,.2); animation: sheet .18s ease-out; }
  .phone .savebar { flex-wrap: wrap; padding: 12px 16px; }
  .phone .savebar .acts { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sbdot { width: 8px; height: 8px; border-radius: 999px; background: var(--warning); flex-shrink: 0; }

  /* Shop workflow steps */
  .step { display: grid; grid-template-columns: 32px minmax(0, 250px) minmax(0, 1fr); gap: 16px; padding: 16px; }
  .phone .step { grid-template-columns: 28px minmax(0, 1fr); gap: 10px 12px; }
  .phone .step .team { grid-column: 1 / -1; }
  .stepn { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 999px; background: var(--muted); font-weight: 600; color: var(--muted-foreground); font-size: 13px; }
  .pchip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 4px 0 4px; border: 1px solid var(--border); border-radius: 999px; background: var(--background); font-weight: 500; }
  .pchip .x { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 999px; color: var(--muted-foreground); }
  .pchip .x:hover { background: var(--accent); color: var(--foreground); }
  .pchip.bad { border-style: dashed; border-color: color-mix(in oklch, var(--warning) 70%, transparent); background: var(--warning-surface); }
  .pchip.bad .nm { text-decoration: line-through; text-decoration-color: color-mix(in oklch, var(--warning-foreground) 60%, transparent); }
  .pchip.added { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
  .phone .pchip { height: 36px; }
  .addp { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 999px; border: 1px dashed var(--border); color: var(--muted-foreground); font-weight: 500; }
  .addp:hover { color: var(--foreground); border-color: var(--muted-foreground); }
  .phone .addp { height: 36px; }
  .hint { display: flex; gap: 6px; align-items: flex-start; margin: 8px 0 0; font-size: 13px; color: var(--muted-foreground); }
  .hint svg { margin-top: 2px; }
  .optrow { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px; border-radius: 8px; text-align: left; }
  .optrow:hover { background: var(--accent); }
  .box { width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid var(--muted-foreground); display: grid; place-items: center; flex-shrink: 0; }
  .box.on { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }

  /* Catalog */
  .achip { display: inline-flex; align-items: center; gap: 2px; height: 26px; padding: 0 2px 0 8px; border-radius: 999px; background: var(--muted); font-size: 12px; }
  .achip button { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 999px; color: var(--muted-foreground); }
  .achip button:hover { background: var(--accent); color: var(--foreground); }
  .phone .achip { height: 32px; } .phone .achip button { width: 28px; height: 28px; }
  .aadd { height: 26px; padding: 0 8px; border-radius: 999px; border: 1px dashed var(--border); font-size: 12px; color: var(--muted-foreground); display: inline-flex; align-items: center; gap: 4px; }
  .phone .aadd { height: 32px; }
  .ainput { height: 28px; width: 160px; padding: 0 8px; border: 1px solid var(--ring); border-radius: 999px; background: var(--background); font-size: 12px; outline: none; }
  .ainput.err { border-color: var(--destructive); }
  .phone .ainput { height: 36px; font-size: 16px; width: 100%; }
  .hit { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; }
  .hit:hover { background: color-mix(in oklch, var(--accent) 45%, transparent); }
  mark { background: color-mix(in oklch, var(--warning) 35%, transparent); color: inherit; border-radius: 2px; padding: 0 1px; }
  .mcard { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .mcard.click { cursor: pointer; } .mcard.click:hover { background: color-mix(in oklch, var(--accent) 45%, transparent); }

  /* People */
  .phead { display: flex; gap: 16px; align-items: flex-start; }
  .phone .phead { flex-wrap: wrap; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
  .phone .grid2 { grid-template-columns: 1fr; }
  .acc { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; }
  .acc p { margin: 0; }
  .jobrow { display: flex; align-items: center; gap: 10px; padding: 10px 14px; }
  .phone .jobrow { flex-wrap: wrap; }
  .phone .jobrow .acts { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .jobrow .acts { display: flex; gap: 6px; }

function stepRow(s, i, phone) {

    return `<span class="pchip ${isBad ? 'bad' : ''} ${!was.includes(id) ? 'added' : ''}" title="${isBad ? esc(`${P(id).name} can't do ${s.name} (${whyNot(id, s)})`) : `${P(id).jobs.length} pending Jobs`}">${av(id)}<span class="nm">${esc(P(id).name)}</span>${isBad ? `<span class="chip warn" style="height:18px;padding:0 5px">${ic('alert', 's14')}${whyNot(id, s)}</span>` : ''}<button class="x" data-act="team-rm" data-step="${s.key}" data-id="${id}" aria-label="Remove ${esc(P(id).name)} from ${s.name}">${ic('x', 's14')}</button></span>`;

    : bad.length ? `<p class="hint warn-t">${ic('alert', 's14')}${bad.map((id) => `${esc(P(id).name)} can't do ${s.name} anymore (${whyNot(id, s)})`).join('; ')}.</p>` : '';
  const extra = s.key === 'pm' ? `<p class="hint">${ic('info', 's14')}Default scope: <b>&nbsp;PM A</b>&nbsp;· the PM mechanic picks A or B on the truck.</p>`

  const jobWarn = jobOff ? `<div class="alert warn mt8">${ic('alert')}<div class="grow"><p><b>The ${s.job} Job is inactive</b> in the Job Catalog, so new Work Orders don't get the ${s.name} step.</p><p class="mt4 row wrap gap12"><button class="btn sm outline" data-act="job-on" data-step="${s.key}">Activate ${s.job}</button><a class="link" data-act="open-cat" data-cat="${s.catId}">Open in Job Catalog</a></p></div></div>` : '';
  return `<div class="step">
    <span class="stepn">${i + 1}</span>
    <div style="min-width:0">
      <div class="row wrap"><h2>${s.name}</h2>${jobOff ? '<span class="chip warn"><span class="dot"></span>Not created</span>' : ''}</div>

    : `<div class="tablewrap mt16"><table class="t"><thead><tr><th>Category</th><th>Status</th><th class="num">Jobs</th><th class="num">Used on</th><th style="width:150px"></th></tr></thead><tbody>
      ${cats.map((c) => `<tr class="click" data-act="open-cat" data-cat="${c.id}"><td><div class="row"><span class="m">${mark(c.name)}</span>${c.system ? sysChip('System') : ''}</div>${c.reason ? `<p class="small muted" style="margin:2px 0 0">${esc(c.reason)}</p>` : ''}</td><td>${statusChip(c.status)}</td><td class="num">${jobsTxt(c)}</td><td class="num">${usedTxt(c)}</td>

    : p.status === 'removed' ? `<div class="alert info mt16">${ic('info')}<div class="grow"><p><b>Removed from the Shop on Sep 2.</b> Not in any list or team. Their name stays on ${p.done} past Jobs, notes and time.</p></div></div>` : '';
  const head = `<div class="phead">${av(id, 'lg')}<div class="grow">
      <div class="row wrap"><h1>${esc(p.name)}</h1>${statusChip(p.status)}${typeChip(p.type)}</div>
      <p class="sub tnum">${p.jobs.length} Jobs pending · ${p.done} completed · last active ${p.last}</p>
      <p class="small muted" style="margin:2px 0 0">${esc(p.email)}</p></div>
      ${p.status !== 'removed' ? `<button class="btn outline" data-act="edit">${ic('pencil')}Edit</button>` : ''}</div>${banner}`;
  const teamsCard = `<section class="card"><div class="card-h"><b>Teams</b><span class="count">${teams.length}</span></div>${teams.length ? `<div class="divide">${teams.map((s) => { const n = S.saved[s.key].length; return `<div class="jobrow"><span class="grow"><b>${s.name}</b><span class="muted small"> · ${n === 1 ? 'only person: new Jobs come straight to them' : `${n} people share the queue`}</span></span><a class="link small" data-act="go" data-to="workflow">Shop workflow</a></div>`; }).join('')}</div>` : `<p class="card-b muted" style="margin:0">Not on any step team. They get Jobs when the Manager assigns them.</p>`}</section>`;
  const jobsCard = `<section class="card"><div class="card-h"><b>Pending Jobs</b><span class="count">${p.jobs.length}</span></div>${p.jobs.length ? `<div class="divide">${p.jobs.map((j) => `<div class="jobrow"><div class="grow"><p class="m" style="margin:0">Truck ${j.truck} · ${esc(j.name)}</p><p class="small muted" style="margin:0"><span class="mono">${j.wo}</span>${j.step ? ` · ${stepOf(j.step).name} step` : ''}</p></div>${p.status === 'removed' ? '' : jobActions(id, j)}</div>`).join('')}</div>` : '<p class="card-b muted" style="margin:0">Nothing pending.</p>'}</section>`;
  const access = p.status === 'removed' ? '' : `<section class="card"><div class="card-h"><b>Access</b></div><div class="divide">
      <div class="acc">${ic('key', 'muted')}<div class="grow"><p class="m">Reset password</p><p class="small muted">Gives a new temporary password. They change it when they sign in.</p></div><button class="btn sm outline" data-act="dead">Reset</button></div>
      <div class="acc">${ic('power', 'muted')}<div class="grow"><p class="m">${p.status === 'active' ? 'Deactivate' : 'Activate'}</p><p class="small muted">${p.status === 'active' ? "Can't sign in or get new Jobs. You can turn it back on." : 'Can sign in again with the same password.'}</p></div><button class="btn sm outline" data-act="${p.status === 'active' ? 'ask-deactivate' : 'activate'}">${p.status === 'active' ? 'Deactivate' : 'Activate'}</button></div>
      <div class="acc">${ic('logout', 'bad-t')}<div class="grow"><p class="m bad-t">Remove from Shop</p><p class="small muted">Leaves every list and team for good. Their name stays on past Work Orders, notes and time.</p></div><button class="btn sm danger-o" data-act="ask-remove">Remove</button></div>
    </div></section>`;
  return `<div class="page">${head}
    <div class="grid2 mt24"><div class="col gap16">${jobsCard}<section class="card"><div class="card-h"><b>Recently completed</b></div><div class="divide">${['Truck 607 · Detailing · Oct 6', 'Truck 605 · Lights · Oct 6', 'Truck 931 · Detailing · Oct 5'].map((t) => `<p class="jobrow" style="margin:0">${ic('check', 's14 ok-t')}<span class="grow">${t}</span></p>`).join('')}</div></section></div>
      <div class="col gap16">${teamsCard}${access}</div></div>
  </div>`;
}

/* Blocker block shown INSIDE the Deactivate / Remove dialog, before confirming */
function blocker(id, verb) {
  const p = P(id);
  if (!p.jobs.length) return `<div class="alert info mt12">${ic('check', 'ok-t')}<div class="grow"><p>No pending Jobs and no clock running. Ready to ${verb.toLowerCase()}.</p></div></div>`;
  const teamJobs = p.jobs.filter((j) => j.step && S.saved[j.step].some((x) => x !== id && eligible(x, stepOf(j.step))));
  return `<div class="alert warn mt12">${ic('alert')}<div class="grow"><p><b>Move ${p.jobs.length} pending Job${p.jobs.length > 1 ? 's' : ''} first.</b> ${esc(p.name)} can't be ${verb === 'Remove' ? 'removed' : 'deactivated'} while they own open work.</p>
      ${teamJobs.length ? `<p class="mt8"><button class="btn sm outline" data-act="all-to-queue" data-pid="${id}">${ic('inbox', 's14')}Send ${teamJobs.length} step Job${teamJobs.length > 1 ? 's' : ''} to their team queue</button></p>` : ''}</div></div>
    <div class="card mt8"><div class="divide">${p.jobs.map((j) => `<div class="jobrow"><div class="grow"><p class="m" style="margin:0">Truck ${j.truck} · ${esc(j.name)}</p><p class="small muted" style="margin:0"><span class="mono">${j.wo}</span></p></div>${jobActions(id, j)}</div>`).join('')}</div></div>`;
}

/* ───────────────────────── Dialogs ───────────────────────── */
function dialog(phone) {
  const d = UI.dialog;
  const shell = (title, desc, body, acts) => `<div class="ov" data-act="close"></div><div class="dlg" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div><h2>${title}</h2>${desc ? `<p class="muted" style="margin:6px 0 0">${desc}</p>` : ''}${body}<div class="acts">${acts}</div></div>`;
  const cancel = (l = 'Cancel') => `<button class="btn outline" data-act="close">${l}</button>`;
  if (d.kind === 'pick') {
    const s = stepOf(d.step);
    const pool = Object.keys(S.people).filter((id) => P(id).status === 'active' && P(id).type === s.type);
    return shell(`${s.name} team`, `Who can take ${s.name}. Only ${s.typeLabel} are listed.`,
      `<div class="mt12">${pool.map((id) => { const on = S.teams[s.key].includes(id); return `<button class="optrow" data-act="team-toggle" data-step="${s.key}" data-id="${id}" aria-pressed="${on}"><span class="box ${on ? 'on' : ''}">${on ? ic('check', 's14') : ''}</span>${av(id)}<span class="grow m">${esc(P(id).name)}</span><span class="small muted tnum">${P(id).jobs.length} pending</span></button>`; }).join('')}</div>
      <p class="hint">${ic('info', 's14')}${S.teams[s.key].filter((x) => eligible(x, s)).length > 1 ? 'Two or more: new Jobs wait in the team queue.' : 'One person: new Jobs are assigned to them.'}</p>`,
      `<button class="btn primary" data-act="close">Done</button>`);
  }
  if (d.kind === 'leave') {
    const ch = teamChanges();
    return shell('Leave without saving?', `Your changes to ${ch.map((c) => `the ${c.step.name} team`).join(' and ')} will be lost.`, '',
      `${cancel('Stay')}<button class="btn danger" data-act="leave" data-to="${d.to}">Leave without saving</button>`);
  }
  if (d.kind === 'job-del') {
    const j = allJobs().find((x) => x.id === d.job);
    if (j.wo) return shell(`${esc(j.name)} can't be deleted`, `It's on ${j.wo} Work Orders. Deactivate it instead: it stays on those Work Orders and their history, and stops showing when adding work.`, '',
      `${cancel()}<button class="btn primary" data-act="job-off" data-job="${j.id}">${ic('power')}Deactivate ${esc(j.name)}</button>`);
    return shell(`Delete ${esc(j.name)}?`, `It was never used on a Work Order. It and its aliases are deleted. This can't be undone.`, '',
      `${cancel()}<button class="btn danger" data-act="job-del-ok" data-job="${j.id}">${ic('trash')}Delete</button>`);
  }
  if (d.kind === 'rename') {
    const j = allJobs().find((x) => x.id === d.job);
    return shell(`Rename ${esc(j.name)}`, 'The new name shows on every Work Order that uses this Job. Its history stays.',
      `<label class="col mt12"><span class="m">Name</span><input class="input" id="rn" value="${esc(d.text)}" data-in="rename"></label>
       <button class="optrow mt8" data-act="keep-alias" aria-pressed="${d.keep}" style="padding:6px 0"><span class="box ${d.keep ? 'on' : ''}">${d.keep ? ic('check', 's14') : ''}</span><span>Keep “${esc(j.name)}” as an alias, so searches still find it</span></button>
       ${j.system ? `<p class="hint">${ic('lock', 's14')}System Job: the ${stepOf(j.system).name} step and Yard keep working after a rename.</p>` : ''}`,
      `${cancel()}<button class="btn primary" data-act="rename-ok" ${norm(d.text) === norm(j.name) || !d.text.trim() ? 'disabled title="Type a new name"' : ''}>Rename</button>`);
  }
  if (d.kind === 'reassign') {
    const p = P(d.pid), j = p.jobs.find((x) => x.id === d.job);
    const s = j.step ? stepOf(j.step) : null;
    const type = s ? s.type : p.type;
    const pool = Object.keys(S.people).filter((id) => id !== d.pid && P(id).status === 'active' && P(id).type === type);
    return shell(`Reassign ${esc(j.name)} · Truck ${j.truck}`, `Choose who owns it now. Only ${s ? s.typeLabel : type + ' mechanics'} are listed.`,
      `<div class="mt12">${pool.map((id) => `<button class="optrow" data-act="reassign-ok" data-pid="${d.pid}" data-job="${j.id}" data-to="${id}">${av(id)}<span class="grow m">${esc(P(id).name)}</span><span class="small muted tnum">${P(id).jobs.length} pending</span>${ic('chevR', 'muted')}</button>`).join('') || '<p class="muted">No one else can take it.</p>'}</div>`,
      cancel());
  }
  if (d.kind === 'deactivate' || d.kind === 'remove') {
    const p = P(d.pid), rm = d.kind === 'remove';
    const teams = teamsOf(d.pid);
    const teamInfo = teams.length ? `<p class="hint">${ic('users', 's14')}${rm ? 'Leaves' : 'Gets no new Jobs from'} ${teams.map((s) => { const left = S.saved[s.key].filter((x) => x !== d.pid && eligible(x, s)).length; return `the ${s.name} team${left ? ` (${left} stay)` : ' — <b class="warn-t">no one left; new Work Orders get it without an owner</b>'}`; }).join(', ')}.</p>` : '';
    const blocked = p.jobs.length > 0;
    return shell(rm ? `Remove ${esc(p.name)} from the Shop?` : `Deactivate ${esc(p.name)}?`,
      rm ? `${esc(p.name)} stops signing in and leaves every list and team. Their name stays on past Work Orders, notes and time.` : `${esc(p.name)} can't sign in or get new Jobs. Their history stays. You can turn it back on.`,
      blocker(d.pid, rm ? 'Remove' : 'Deactivate') + teamInfo + (rm ? `<p class="hint">${ic('info', 's14')}Created by mistake and never did anything? Then the app offers Delete instead.</p>` : ''),
      `${cancel()}<button class="btn ${rm ? 'danger' : 'primary'}" data-act="${rm ? 'remove-ok' : 'deactivate-ok'}" ${blocked ? `disabled title="Move the pending Jobs first"` : ''}>${rm ? ic('logout') + 'Remove from Shop' : ic('power') + 'Deactivate'}</button>`);
  }
  if (d.kind === 'edit') {
    const p = P(d.pid);
    const changed = d.type !== p.type;
    const teams = teamsOf(d.pid).filter((s) => s.type !== d.type);
    const oldJobs = p.jobs.length;
    const warn = changed ? `${teams.length ? `<div class="alert warn mt12">${ic('users')}<div class="grow"><p>${esc(p.name)} leaves ${teams.map((s) => `the <b>${s.name}</b> team`).join(' and ')}: ${d.type} people can't do ${teams.map((s) => s.name).join(' or ')}.</p></div></div>` : ''}
      ${oldJobs ? `<div class="alert bad mt8">${ic('alert')}<div class="grow"><p><b>Move ${oldJobs} pending Job${oldJobs > 1 ? 's' : ''} first.</b> They're ${p.type} work. <button class="link" data-act="close-go-jobs">See the Jobs</button></p></div></div>` : ''}` : '';
    return shell(`Edit ${esc(p.name)}`, '', `<label class="col mt12"><span class="m">Name</span><input class="input" value="${esc(p.name)}"></label>
      <p class="m mt12" style="margin-bottom:6px">Type</p><div class="segc">${['Standard', 'PM', 'Safety'].map((t) => `<button class="${d.type === t ? 'on' : ''}" data-act="edit-type" data-t="${t}">${t}</button>`).join('')}</div>
      <p class="small muted mt4">Standard: shop work, Alignment, Detailing. PM: the PM step. Safety: Quality Check.</p>${warn}`,
      `${cancel()}<button class="btn primary" data-act="edit-ok" ${changed && oldJobs ? 'disabled' : ''}>Save</button>`);
  }
  if (d.kind === 'qc-approve') {
    const t = S.qc.find((x) => x.id === d.id);
    return shell(`Approve Truck ${t.n}?`, `Recorded as approved by Cristian Perez (Shop Manager, backup for Safety). You can then close ${t.wo}.`, '',
      `${cancel('Back')}<button class="btn primary" data-act="qc-approve-ok" data-id="${t.id}">${ic('check')}Approve</button>`);
  }
  return '';
}

/* ───────────────────────── Actions ───────────────────────── */
const PRESETS = {
  'wf': ['Shop workflow · teams', () => {}],
  'wf-inelig': ['Owner no longer eligible', () => { P('a1').type = 'PM'; }],
  'wf-empty': ['Empty team', () => { S.teams.alignment = []; S.saved.alignment = []; }],
  'wf-job': ['Step Job inactive', () => { S.jobOff.detailing = true; }],
  'wf-unsaved': ['Unsaved changes', () => { S.teams.detailing = ['anthony', 'a2', 'elliot']; }],
  'hours': ['Shop hours tab', () => { UI.tab = 'hours'; }],
  'cat': ['Job Catalog', () => { UI.screen = 'catalog'; }],
  'cat-search': ['Search “lineas”', () => { UI.screen = 'catalog'; UI.q = 'lineas'; }],
  'catd': ['Category detail', () => { UI.screen = 'category'; UI.catId = 'susp'; }],
  'catd-del': ['Delete vs deactivate', () => { UI.screen = 'category'; UI.catId = 'susp'; UI.dialog = { kind: 'job-del', job: catById('susp').jobs[1].id }; }],
  'catd-alias': ['Alias conflict', () => { UI.screen = 'category'; UI.catId = 'susp'; const j = catById('susp').jobs[1]; UI.alias = { job: j.id, text: 'alineacion', err: aliasError('alineacion', j.id) }; UI.focus = 'alias-in'; }],
  'ppl': ['People', () => { UI.screen = 'people'; }],
  'person': ['Person detail', () => { UI.screen = 'person'; UI.personId = 'anthony'; }],
  'remove': ['Remove · blocked', () => { UI.screen = 'person'; UI.personId = 'anthony'; UI.dialog = { kind: 'remove', pid: 'anthony' }; }],
  'type': ['Change type warning', () => { UI.screen = 'person'; UI.personId = 'anthony'; UI.dialog = { kind: 'edit', pid: 'anthony', type: 'PM' }; }],
  'qc': ['Manager on /qc', () => { UI.screen = 'qc'; }],
};
function aliasError(text, jobId) {
  const n = norm(text);
  if (!n) return 'Type an alias.';
  for (const j of allJobs()) {
    if (norm(j.name) === n) return `“${esc(text)}” is already the name of <b>${esc(j.name)}</b> · ${esc(j.cat.name)}.`;
    const a = j.aliases.find((x) => norm(x) === n);
    if (a) return j.id === jobId ? `${esc(j.name)} already has “${esc(a)}”.` : `“${esc(text)}” is already an alias of <b>${esc(j.name)}</b> · ${esc(j.cat.name)} (as “${esc(a)}”). <a class="link" data-act="open-job" data-cat="${j.cat.id}" data-job="${j.id}">Open ${esc(j.name)}</a>`;
  }
  return null;
}
function findJob(id) { for (const c of S.cats) { const j = c.jobs.find((x) => x.id === id); if (j) return { c, j }; } return {}; }
function go(to) {
  if (UI.screen === 'workflow' && teamChanges().length && to !== 'workflow') { UI.dialog = { kind: 'leave', to }; return; }
  UI.screen = to; UI.menu = null; UI.nav = false; UI.keepScroll = false; UI.alias = null;
}
function moveJob(pid, jobId, toId) {
  const p = P(pid); const k = p.jobs.findIndex((x) => x.id === jobId); const [j] = p.jobs.splice(k, 1);
  if (toId) P(toId).jobs.push(j);
  return j;
}

document.addEventListener('click', (e) => {
  const dev = e.target.closest('[data-dev]'); if (dev) { UI.device = dev.dataset.dev; render(); return; }
  const pre = e.target.closest('[data-preset]');
  if (pre) { seed(); UI = fresh(UI); PRESETS[pre.dataset.preset][1](); UI.keepScroll = false; render(); return; }
  const el = e.target.closest('[data-act]');
  if (!el) { if (UI.menu && !e.target.closest('.menu')) { UI.menu = null; render(); } return; }
  const a = el.dataset.act, d = el.dataset;
  if (a !== 'menu' && !e.target.closest('.menu')) UI.menu = null;
  switch (a) {
    case 'go': go(d.to); break;
    case 'leave': S.teams = clone(S.saved); UI.dialog = null; go(d.to); break;
    case 'dead': toast('info', 'Not part of this proposal.'); break;
    case 'nav-open': UI.nav = true; break;
    case 'nav-close': UI.nav = false; break;
    case 'tab': UI.tab = d.tab; break;
    case 'close': UI.dialog = null; break;
    case 'toast-x': UI.toast = null; break;
    case 'undo': if (UNDO) { UNDO(); UNDO = null; } UI.toast = null; break;
    case 'menu': UI.menu = UI.menu === d.menu ? null : d.menu; e.stopPropagation(); break;
    // Shop workflow
    case 'pick': UI.dialog = { kind: 'pick', step: d.step }; break;
    case 'team-toggle': { const t = S.teams[d.step]; S.teams[d.step] = t.includes(d.id) ? t.filter((x) => x !== d.id) : [...t, d.id]; break; }
    case 'team-rm': S.teams[d.step] = S.teams[d.step].filter((x) => x !== d.id); break;
    case 'wf-discard': S.teams = clone(S.saved); break;
    case 'wf-save': S.saved = clone(S.teams); toast('ok', 'Shop workflow saved. New Work Orders use these teams.'); break;
    case 'job-on': delete S.jobOff[d.step]; toast('ok', 'Detailing is active again. New Work Orders get the Detailing step.'); break;
    case 'day': { const n = +d.day; S.hours.days = S.hours.days.includes(n) ? S.hours.days.filter((x) => x !== n) : [...S.hours.days, n].sort(); break; }
    case 'hours-discard': S.hours = clone(S.hoursSaved); break;
    case 'hours-save': S.hoursSaved = clone(S.hours); toast('ok', 'Shop hours saved.'); break;
    // Catalog
    case 'catf': UI.catFilter = d.f; break;
    case 'open-cat': if (e.target.closest('button[data-act="menu"],button[data-act="cat-on"],.menu')) break; UI.catId = d.cat; go('category'); break;
    case 'open-job': UI.catId = d.cat; UI.flash = d.job; go('category'); break;
    case 'cat-on': { const c = catById(d.cat); const undo = snapshot(); c.status = 'active'; delete c.reason; toast('ok', `${esc(c.name)} is active. Its Jobs show when adding work.`, undo); e.stopPropagation(); break; }
    case 'cat-off': { const c = catById(d.cat); const undo = snapshot(); c.status = 'inactive'; c.reason = 'Deactivated by Cristian · Oct 7'; toast('ok', `${esc(c.name)} deactivated.`, undo); break; }
    case 'alias-add': UI.alias = { job: d.job, text: '', err: null }; UI.focus = 'alias-in'; break;
    case 'alias-rm': { const { j } = findJob(d.job); const undo = snapshot(); const [gone] = j.aliases.splice(+d.k, 1); toast('ok', `Alias “${esc(gone)}” removed from ${esc(j.name)}.`, undo); break; }
    case 'job-del': UI.dialog = { kind: 'job-del', job: d.job }; break;
    case 'job-off': { const { j } = findJob(d.job); const undo = snapshot(); j.status = 'inactive'; UI.dialog = null; toast('ok', `${esc(j.name)} deactivated. It stays on its ${j.wo} Work Orders.`, undo); break; }
    case 'job-on2': { const { j } = findJob(d.job); j.status = 'active'; toast('ok', `${esc(j.name)} is active.`); break; }
    case 'job-del-ok': { const { c, j } = findJob(d.job); c.jobs = c.jobs.filter((x) => x.id !== j.id); UI.dialog = null; toast('ok', `${esc(j.name)} deleted.`); break; }
    case 'rename': { const { j } = findJob(d.job); UI.dialog = { kind: 'rename', job: d.job, text: j.name, keep: true }; UI.focus = 'rn'; break; }
    case 'keep-alias': UI.dialog.keep = !UI.dialog.keep; break;
    case 'rename-ok': { const { j } = findJob(UI.dialog.job); const old = j.name; j.name = UI.dialog.text.trim(); if (UI.dialog.keep) j.aliases.push(old); UI.dialog = null; UI.flash = j.id; toast('ok', `Renamed to ${esc(j.name)}${UI.flash && j.aliases.includes(old) ? `. “${esc(old)}” is now an alias` : ''}.`); break; }
    // People
    case 'pplf': UI.pplFilter = d.f; break;
    case 'open-person': UI.personId = d.id; go('person'); break;
    case 'ask-remove': UI.dialog = { kind: 'remove', pid: UI.personId }; break;
    case 'ask-deactivate': UI.dialog = { kind: 'deactivate', pid: UI.personId }; break;
    case 'activate': P(UI.personId).status = 'active'; toast('ok', `${esc(P(UI.personId).name)} can sign in again.`); break;
    case 'to-queue': { const undo = snapshot(); const j = moveJob(d.pid, d.job, null); toast('ok', `${esc(j.name)} on Truck ${j.truck} is in the ${stepOf(j.step).name} queue.`, undo); break; }
    case 'all-to-queue': { const undo = snapshot(); const p = P(d.pid); const n = p.jobs.filter((j) => j.step && S.saved[j.step].some((x) => x !== d.pid && eligible(x, stepOf(j.step)))); n.forEach((j) => moveJob(d.pid, j.id, null)); toast('ok', `${n.length} Jobs sent to their team queue.`, undo); break; }
    case 'reassign': UI.back = UI.dialog; UI.dialog = { kind: 'reassign', pid: d.pid, job: d.job }; break;
    case 'reassign-ok': { const undo = snapshot(); const j = moveJob(d.pid, d.job, d.to); UI.dialog = UI.back || null; UI.back = null; toast('ok', `${esc(j.name)} on Truck ${j.truck} is now ${esc(P(d.to).name)}'s.`, undo); break; }
    case 'remove-ok': { const p = P(UI.dialog.pid); p.status = 'removed'; STEPS.forEach((s) => { S.teams[s.key] = S.teams[s.key].filter((x) => x !== UI.dialog.pid); S.saved[s.key] = S.saved[s.key].filter((x) => x !== UI.dialog.pid); }); UI.dialog = null; UI.screen = 'people'; toast('ok', `${esc(p.name)} was removed from the Shop. Their history stays.`); break; }
    case 'deactivate-ok': { const p = P(UI.dialog.pid); p.status = 'inactive'; UI.dialog = null; toast('ok', `${esc(p.name)} is inactive.`); break; }
    case 'edit': UI.dialog = { kind: 'edit', pid: UI.personId, type: P(UI.personId).type }; break;
    case 'edit-type': UI.dialog.type = d.t; break;
    case 'edit-ok': { const p = P(UI.dialog.pid); if (UI.dialog.type !== p.type) { p.type = UI.dialog.type; STEPS.forEach((s) => { if (s.type !== p.type) { S.teams[s.key] = S.teams[s.key].filter((x) => x !== UI.dialog.pid); S.saved[s.key] = S.saved[s.key].filter((x) => x !== UI.dialog.pid); } }); } UI.dialog = null; toast('ok', 'Saved.'); break; }
    case 'close-go-jobs': UI.dialog = null; break;
    // QC
    case 'qc-take': S.qc.find((t) => t.id === d.id).taken = 'cristian'; toast('ok', `Truck ${S.qc.find((t) => t.id === d.id).n} is yours to review.`); break;
    case 'qc-approve': UI.dialog = { kind: 'qc-approve', id: d.id }; break;
    case 'qc-approve-ok': { const t = S.qc.find((x) => x.id === d.id); S.qc = S.qc.filter((x) => x !== t); UI.dialog = null; toast('ok', `Truck ${t.n} approved by Cristian Perez (backup for Safety).`); break; }
  }
  render();
});
document.addEventListener('input', (e) => {
  const k = e.target.dataset.in; if (!k) return;
  if (k === 'q') { UI.q = e.target.value; UI.focus = 'q'; }
  if (k === 'pplq') { UI.pplQ = e.target.value; UI.focus = 'pq'; }
  if (k === 'cutoff') { S.hours.cutoff = e.target.value; UI.focus = 'cutoff'; }
  if (k === 'alias') { UI.alias.text = e.target.value; UI.alias.err = null; UI.focus = 'alias-in'; }
  if (k === 'rename') { UI.dialog.text = e.target.value; UI.focus = 'rn'; }
  render();
});
document.addEventListener('keydown', (e) => {
  if (e.target.id === 'alias-in') {
    if (e.key === 'Enter') { const err = aliasError(UI.alias.text, UI.alias.job); if (err) UI.alias.err = err; else { findJob(UI.alias.job).j.aliases.push(UI.alias.text.trim()); toast('ok', `Alias “${esc(UI.alias.text.trim())}” added.`); UI.alias = null; UI.focus = null; } render(); }
    if (e.key === 'Escape') { UI.alias = null; UI.focus = null; render(); }
  } else if (e.key === 'Escape' && UI.dialog) { UI.dialog = null; render(); }
});
document.addEventListener('focusout', (e) => {
  // Validate the alias on blur (UX-7-022), but don't lose what was typed.
  if (e.target.id === 'alias-in' && UI.alias && UI.alias.text.trim()) { const err = aliasError(UI.alias.text, UI.alias.job); if (err && !UI.alias.err) { UI.alias.err = err; UI.focus = null; setTimeout(render); } }
  if (['q', 'pq', 'alias-in', 'rn'].includes(e.target.id)) setTimeout(() => { if (document.activeElement?.id !== e.target.id) UI.focus = null; });
});
document.getElementById('theme').onclick = () => { document.documentElement.classList.toggle('dark'); render(); };
document.getElementById('reset').onclick = () => { seed(); UI = fresh(UI); render(); };
document.getElementById('presets').innerHTML = Object.entries(PRESETS).map(([k, [l]]) => `<button data-preset="${k}">${l}</button>`).join('');
render();
</script>
</body>
